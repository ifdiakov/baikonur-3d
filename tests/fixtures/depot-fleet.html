<header><h1 id="title">ЖД депо «Космотранс»</h1><p id="subtitle">Адаптация модели для макета</p></header>
<script type="importmap">{"imports":{"three":"../../src/vendor/three-r160/build/three.module.js","three/addons/":"../../src/vendor/three-r160/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {createKosmotransDepot} from '../../src/kosmotrans-depot.js';
import {createRoadFleetVehicle,ROAD_FLEET} from '../../src/road-fleet.js';
import {createSprinterVehicle} from '../../src/sprinter-source.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xd5d3c9);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.01,2000),light=new THREE.HemisphereLight(0xe5efff,0xa39275,2.2),sun=new THREE.DirectionalLight(0xfff3dd,2.8);sun.position.set(-80,150,100);scene.add(light,sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshStandardMaterial({color:0xbcb19a,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;scene.add(ground);
const depot=createKosmotransDepot({parent:scene});depot.root.position.set(0,0,0);depot.root.scale.setScalar(1);await depot.load();
const cars=Object.keys(ROAD_FLEET).map(id=>createRoadFleetVehicle(scene,id));
const sprinterRoot=new THREE.Group();scene.add(sprinterRoot);const sprinter=createSprinterVehicle({root:sprinterRoot,wheels:[],update(){sprinterRoot.visible=false}});cars.push(sprinter);
await Promise.all(cars.map(c=>c.loadDetail()));
const pose=i=>({position:new THREE.Vector3((i-1.5)*4.4,0,0),tangent:new THREE.Vector3(0,0,1),distance:0,direction:1,opacity:1});
window.fixtureRender=(view='depot')=>{
 const fleet=view.startsWith('fleet');depot.root.visible=!fleet;cars.forEach((c,i)=>{c.update({...pose(i),opacity:fleet?1:0},view==='fleet-night')});
 light.intensity=view==='fleet-night'?.4:2.2;sun.intensity=view==='fleet-night'?.2:2.8;scene.background.set(view==='fleet-night'?0x182535:0xd5d3c9);
 document.getElementById('title').textContent=fleet?'Автомобили космодрома':'ЖД депо «Космотранс»';document.getElementById('subtitle').textContent=fleet?'Land Cruiser 300 · УАЗ Патриот · Буханка · Sprinter':'Модель из коллекции владельца · облегчённая геометрия';
 camera.position.set(...(fleet?(view==='fleet-rear'?[-12,8,-19]:[12,8,19]):view==='depot-top'?[0,450,.01]:[300,300,360]));camera.lookAt(0,fleet?1:0,0);camera.updateMatrixWorld();renderer.render(scene,camera);
 return {depot:depot.stats(),cars:cars.map(c=>({type:c.type,...c.sourceState,visible:c.root.visible,wheels:c.wheels.length}))};
};window.fixtureState=window.fixtureRender();window.fixtureReady=true;
</script></html>
