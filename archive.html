<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RocketTrip · Фотоэтюды Байконура</title><style>body{margin:0;background:#19232b;color:#eef3f4;font:15px/1.5 Arial}canvas{display:block}aside{position:fixed;top:18px;left:18px;width:290px;padding:20px;background:#11212de8;border:1px solid #78898e;border-radius:12px}h1{font-size:22px;margin:0 0 14px}select,button,a{font:inherit}select{width:100%;padding:8px}p{color:#cad3d7}a{color:#f0b6a9}small{display:block;color:#9eafb6;margin-top:15px}@media(max-width:600px){aside{width:calc(100% - 72px);font-size:12px;padding:18px}h1{font-size:17px}}</style><aside><h1>АРХИВ МОДЕЛЕЙ</h1><select id="study"></select><p id="note"></p><a id="source" target="_blank" rel="noopener">Исходная папка ↗</a><small>Эти фотоэтюды не поставлены на карту: точные координаты или ориентация пока не установлены. Размеры отдельных элементов приблизительные.</small><p><a href="./">← На карту космодрома</a></p></aside><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{ARCHIVE_GALLERY}from'./src/archive-manifest.js?v=20261029-all-silos-v2';import{buildArchiveModel}from'./src/archive-models.js?v=20261029-all-silos-v2';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x26343e);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,6000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(2,devicePixelRatio));document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.48;scene.add(new THREE.HemisphereLight(0xd3e5f5,0x665b50,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-100,200,70);scene.add(sun);
const models=[];for(const entry of ARCHIVE_GALLERY){const root=new THREE.Group();root.name=entry.title;scene.add(root);const features=buildArchiveModel(root,entry);root.visible=false;models.push({root,entry,features});const op=document.createElement('option');op.value=entry.id;op.textContent=entry.title;document.querySelector('#study').append(op);}
function select(id){const item=models.find(m=>m.entry.id===id)||models[0];models.forEach(m=>m.root.visible=m===item);const box=new THREE.Box3().setFromObject(item.root),size=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),r=Math.max(size.x,size.z,size.y*2);controls.target.copy(c);camera.position.copy(c).add(new THREE.Vector3(.95,.8,1.2).multiplyScalar(r));controls.update();document.querySelector('#note').textContent=item.entry.note;document.querySelector('#source').href='https://drive.google.com/drive/folders/'+item.entry.folder;document.querySelector('#study').value=item.entry.id;return item.entry.id;}
document.querySelector('#study').onchange=e=>select(e.target.value);select(new URLSearchParams(location.search).get('model'));window.__ARCHIVE_QA={select,stats:()=>models.map(m=>({id:m.entry.id,features:m.features,visible:m.root.visible}))};window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera);}frame();
</script></html>
