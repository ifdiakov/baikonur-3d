name: Museum 4 requested changes
on:
  push:
    branches: [main]
    paths: ['index.html','src/**','data/catalog.json','data/transport-network.json','tests/museum4-browser.mjs','tests/site31-geometry.mjs','tests/road-surfaces-geometry.mjs','scripts/verify-published.mjs','.github/workflows/verify-museum4.yml']
  workflow_dispatch:
concurrency:
  group: baikonur-museum4
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependencies
        run: |
          npm install --no-save playwright@1.57.0 three@0.160.1
          npx playwright install --with-deps chromium
      - name: Verify detailed Site 31, continuous roads and complete flight cycle
        run: |
          node tests/site31-geometry.mjs
          node tests/road-surfaces-geometry.mjs
          node tests/arrival-geometry.mjs
      - name: Serve current checkout
        run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Verify all twelve requested changes in Chromium
        run: node tests/museum4-browser.mjs
      - name: Verify the exact published source files
        run: node scripts/verify-published.mjs
      - name: Verify the published museum and capture review images
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/
          QA_PREFIX: public
        run: node tests/museum4-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: museum4-visual-qa
          path: qa-museum4/
