name: Museum 3 — traffic, four coaches and flank territories
# Historical schematic checks are retained for manual inspection.
# The OSM live product is checked and released by verify-osm-release.yml.
on:
  workflow_dispatch:
concurrency:
  group: baikonur-traffic
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and geometry dependencies
        run: |
          npm install --no-save playwright@1.57.0 three@0.160.1
          npx playwright install --with-deps chromium
      - name: Verify wheel contacts, pitch, lanes and track continuity
        run: |
          node tests/flanks-geometry.mjs
          node tests/traffic-geometry.mjs
          node tests/road-vehicles-geometry.mjs
          node tests/train-consist.mjs
          node tests/arrival-geometry.mjs
          node tests/transport-geometry.mjs
      - name: Start local museum
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
      - name: Verify traffic and landing in Chromium
        run: |
          node tests/traffic-browser.mjs
          node tests/road-vehicles-browser.mjs
          node tests/train-browser.mjs
          node tests/flanks-browser.mjs
      - name: Wait for public traffic interface
        run: node scripts/verify-published.mjs
      - name: Verify published traffic and landing
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/?museum3=${{ github.sha }}
          QA_PREFIX: public
        run: |
          node tests/traffic-browser.mjs
          node tests/road-vehicles-browser.mjs
          node tests/train-browser.mjs
          node tests/flanks-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traffic-landing-qa
          path: |
            qa-traffic/
            qa-road-vehicles/
            qa-train/
            qa-flanks/
