# CI_RELIABILITY_V1
name: Lightweight railway stations
on:
  pull_request:
    branches: [main]
    paths: ['src/rail-stations.js', 'src/rail-road-clearance.js', 'src/osm-transport.js', 'index.html', 'assets/models/rail-station/**', 'tests/rail-station-*.mjs', 'tests/rail-road-clearance.mjs', '.github/workflows/verify-rail-stations.yml']
  push:
    branches: [main, fix/ci-repair-20261114]
    paths: ['src/rail-stations.js', 'src/rail-road-clearance.js', 'src/osm-transport.js', 'index.html', 'assets/models/rail-station/**', 'tests/rail-station-*.mjs', 'tests/rail-road-clearance.mjs', '.github/workflows/verify-rail-stations.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rail-stations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select relevant checks before downloading tools
        id: ci_scope
        run: node scripts/ci/impact.mjs verify-rail-stations.yml
      - uses: actions/setup-node@v4
        if: steps.ci_scope.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Reuse downloaded verification dependencies
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: museum-npm-${{ runner.os }}-v1-${{ hashFiles('package-lock.json') }}
      - name: Reuse matching browser binaries
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: museum-playwright-${{ runner.os }}-1.57.0-${{ hashFiles('package-lock.json') }}
      - name: Install verification dependencies
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Validate asset, track placement, shared model and recovery
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          node tests/rail-road-clearance.mjs
          node tests/rail-station-source.mjs
      - name: Serve checkout
        if: steps.ci_scope.outputs.run == 'true'
        run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Inspect stations in full museum and on mobile
        if: steps.ci_scope.outputs.run == 'true'
        run: node tests/rail-station-browser.mjs
      - name: Verify live deployment and repeat browser check
        if: (github.event_name != 'pull_request') && (steps.ci_scope.outputs.run == 'true')
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/
          QA_PREFIX: public
        run: |
          node scripts/verify-rail-station-published.mjs
          node tests/rail-station-browser.mjs
      - uses: actions/upload-artifact@v4
        if: (always()) && (steps.ci_scope.outputs.run == 'true')
        with:
          name: rail-station-evidence
          path: qa-rail-station/
