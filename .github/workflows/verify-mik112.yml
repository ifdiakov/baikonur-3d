name: MIK112 and Energia transporters — verified publication
on:
  push:
    branches: [main]
    paths:
      - 'src/mik112.js'
      - 'src/mik112-rail.js'
      - 'scripts/integrate-mik112.mjs'
      - 'scripts/refine-mik112.mjs'
      - 'scripts/relocate-mik112.mjs'
      - 'tests/mik112-browser.mjs'
      - '.github/workflows/verify-mik112.yml'
  workflow_dispatch:
concurrency:
  group: museum-mik112
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  mik112:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate current museum source
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("/tmp/mik112-main.mjs",fs.readFileSync("index.html","utf8").match(/<script type="module">([\s\S]*?)<\/script>/)[1])'
          node --check /tmp/mik112-main.mjs
          node --check --input-type=module < src/mik112.js
          node --check --input-type=module < src/mik112-rail.js
          node --check tests/mik112-browser.mjs
      - name: Install browser and vendor source for reproducibility
        run: |
          npm install --no-save playwright@1.57.0 three@0.160.1
          npx playwright install --with-deps chromium
          mkdir -p qa-mik112/vendor
          cp node_modules/three/build/three.module.js qa-mik112/vendor/
          cp node_modules/three/examples/jsm/controls/OrbitControls.js qa-mik112/vendor/
      - name: Start preview server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mik112-server.log 2>&1 &
          sleep 2
      - name: Verify local geometry and browser rendering before publishing
        id: local
        run: node tests/mik112-browser.mjs
      - name: Record tested revision
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Confirm exact current public assets
        id: publicassets
        run: |
          set -e
          for n in $(seq 1 24); do
            ok=1
            for file in index.html src/mik112.js src/mik112-rail.js data/catalog.json data/transport-network.json; do
              if ! curl -fsSL --retry 2 --max-time 20 "https://ifdiakov.github.io/baikonur-3d/$file?verify=${GITHUB_SHA}&attempt=$n" -o /tmp/mik112-public-asset \
                 || ! cmp -s "$file" /tmp/mik112-public-asset; then ok=0; break; fi
            done
            if [ "$ok" = 1 ]; then exit 0; fi
            sleep 8
          done
          exit 1
      - name: Test published WebGL scene
        id: publicbrowser
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/
          QA_PREFIX: public
        run: node tests/mik112-browser.mjs
      - name: Record verified release
        if: success()
        env:
          TARGET: ${{ steps.commit.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("data/qa-mik112.json",JSON.stringify({targetCommit:process.env.TARGET,runId:process.env.RUN_ID,local:"success",publicBrowser:"success",version:"1.3-photo-frames",mapPlacement:[640,361],scale:0.14,transporterSide:"north-east",checkedAt:new Date().toISOString()},null,2)+"\n")'
          git add data/qa-mik112.json
          git commit -m 'ci: record verified MIK112 scale, opposite-end transporters and plan placement'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save screenshots and exact tested source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mik112-browser-qa
          path: |
            qa-mik112/
            index.html
            src/
            data/*.json
            assets/
            baykonur-plan.png
            scripts/*mik112.mjs
            tests/mik112-browser.mjs
          if-no-files-found: ignore
