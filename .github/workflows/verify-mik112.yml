name: MIK112 model and reconstruction — verified integration
on:
  push:
    branches: [main, fix/buran-loss-integration-20261110, fix/bridge-sign112-20261110, fix/mik112-photo-20261110, fix/mik112-reference-20261111, fix/buran-launch-1988-20261111, fix/energia-effects-20261114, fix/**]
    paths: ["src/buran-loss*", "src/buran-launch*", "src/mik112*.js", "src/site110*.js", "src/archive-kit.js", "src/archive-models.js", "src/museum-menu.js", "src/energia-rocket-exhaust.js", "src/energia-buran-effects.js", "src/energia-polyus-launch.js", "src/energia-ground-*.js", "src/energia-plasma-shader.js", "src/bridge-ground-surface.js", "src/road-signs.js", "data/road-signs.json", "scripts/prepare-buran-loss.mjs", "scripts/prepare-bridge-sign112.mjs", "scripts/refine-mik112-callouts.mjs", "scripts/ci/wait-pages-publication.mjs", "tests/mik112-*.mjs", "tests/buran-loss-*.mjs", "tests/buran-launch-*.mjs", "tests/energia-launch-node.mjs", "tests/energia-launch-browser.mjs", "tests/energia-surface-browser.mjs", "tests/energia-ground-occlusion.mjs", "tests/energia-background-loading.mjs", "tests/energia-exhaust-geometry.mjs", "tests/site110-launch-rig.mjs", "tests/bridge-sign112-*.mjs", ".github/workflows/verify-mik112.yml", "tests/menu-catalog-contract.mjs", "tests/helpers/menu-markup.mjs", "package.json", "package-lock.json"]
  workflow_dispatch:
    inputs:
      target:
        description: Acceptance profile (auto preserves the branch selection)
        type: choice
        default: auto
        options: [auto, mik112, buran-loss, bridge-sign112, buran-launch, energia-surface]
concurrency:
  group: museum-mik112-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pages_publication:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for successful Pages publication of this exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/wait-pages-publication.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mik112-pages-gate-attempt-${{ github.run_attempt }}
          path: qa-ci/mik112-pages-publication.json
          retention-days: 7
  mik112:
    needs: pages_publication
    # An explicit status predicate lets candidates run after the skipped gate.
    if: ${{ !cancelled() && (github.ref != 'refs/heads/main' || needs.pages_publication.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, mobile, workshop]
    env:
      QA_MODES: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the relevant existing acceptance suite
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          target=buran-loss
          if [[ '${{ github.ref_name }}' == 'fix/ci-repair-20261114' ]]; then target=buran-launch; fi
          if [[ -n "$REQUESTED_TARGET" && "$REQUESTED_TARGET" != auto ]]; then
            target="$REQUESTED_TARGET"
          elif [[ '${{ github.ref_name }}' == 'fix/energia-effects-20261114' ]]; then
            target=energia-surface
          elif [[ '${{ github.ref_name }}' == 'fix/buran-launch-1988-20261111' ]]; then
            target=buran-launch
          elif [[ '${{ github.event_name }}' == 'workflow_dispatch' || '${{ github.ref_name }}' == 'fix/mik112-photo-20261110' || '${{ github.ref_name }}' == 'fix/mik112-reference-20261111' ]]; then
            target=mik112
          elif [[ '${{ github.ref_name }}' == 'fix/bridge-sign112-20261110' ]]; then
            target=bridge-sign112
          elif [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            changed_paths=$(git diff --name-only "$BEFORE" HEAD)
            if printf '%s\n' "$changed_paths" | grep -Eq '(^src/energia-(polyus-launch|ground-.*)\.js$|^tests/energia-(surface-browser|ground-occlusion)\.mjs$)'; then
              target=energia-surface
            elif printf '%s\n' "$changed_paths" | grep -Eq '(^src/buran-launch|^tests/(buran-launch-|site110-launch-rig\.mjs$|energia-exhaust-geometry\.mjs$|energia-launch-node\.mjs$)|^src/energia-(rocket-exhaust|buran-effects|polyus-launch)\.js$|^src/site110(-kinematics)?\.js$|^src/archive-kit\.js$)'; then
              target=buran-launch
            elif printf '%s\n' "$changed_paths" | grep -Ev '^tests/mik112-publish-gate\.mjs$' | grep -Eq '(^src/mik112(-materials|-photo-detail|-rail-plan)?\.js$|^tests/mik112-)'; then
              target=mik112
            elif printf '%s\n' "$changed_paths" | grep -Eq '(^src/(bridge-ground-surface|mik112-cards|road-signs)\.js$|^data/road-signs\.json$|bridge-sign112|refine-mik112-callouts)'; then
              target=bridge-sign112
            elif printf '%s\n' "$changed_paths" | grep -Eq '^(scripts/ci/wait-pages-publication\.mjs|tests/mik112-publish-gate\.mjs|\.github/workflows/verify-mik112\.yml)$' &&
                 ! printf '%s\n' "$changed_paths" | grep -Ev '^(scripts/ci/wait-pages-publication\.mjs|tests/mik112-publish-gate\.mjs|\.github/workflows/verify-mik112\.yml|PROJECT_CONTEXT\.md|docs/.*)$' | grep -q .; then
              if [[ -f src/buran-launch.js ]]; then target=buran-launch; else target=mik112; fi
            fi
          elif [[ -f src/mik112-cards.js ]]; then
            target=bridge-sign112
          fi
          case "$target" in mik112|buran-loss|bridge-sign112|buran-launch|energia-surface) ;; *) echo 'Unknown acceptance target'; exit 2 ;; esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Prepare the approved integration only
        run: |
          git diff --exit-code
          node --check src/buran-loss.js
          node --check src/buran-loss-scene.js
          if [ '${{ steps.scope.outputs.target }}' = mik112 ]; then
            node --check src/mik112.js
            node --check src/mik112-materials.js
            node --check src/mik112-photo-detail.js
          fi
          if [ '${{ steps.scope.outputs.target }}' = buran-launch ]; then
            node --check src/buran-launch.js
            node --check src/buran-launch-history.js
            node --check src/energia-buran-effects.js
            node --check src/site110-kinematics.js
            node --check src/energia-rocket-exhaust.js
          fi
          cmp index.html museum.html
      - uses: actions/cache@v4
        if: steps.scope.outputs.target != 'energia-surface' || matrix.mode == 'desktop'
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: museum-mik112-Linux-playwright1.57.0-three0.160.1-${{ hashFiles('package-lock.json') }}
      - name: Install browser and run source checks
        if: steps.scope.outputs.target != 'energia-surface' || matrix.mode == 'desktop'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          if [ '${{ matrix.mode }}' = desktop ]; then
            node tests/mik112-publish-gate.mjs
            if [ '${{ steps.scope.outputs.target }}' = buran-launch ]; then
              node tests/buran-launch-source.mjs
              node tests/energia-exhaust-geometry.mjs
              node tests/energia-launch-node.mjs
              node tests/site110-geometry.mjs
              node tests/site110-launch-rig.mjs
              node tests/menu-catalog-contract.mjs
            elif [ '${{ steps.scope.outputs.target }}' = energia-surface ]; then
              node tests/energia-exhaust-geometry.mjs
              node tests/energia-launch-node.mjs
              node tests/energia-ground-occlusion.mjs
              node tests/energia-background-loading.mjs
            else
              node tests/buran-loss-source.mjs
            fi
            if [ '${{ steps.scope.outputs.target }}' = bridge-sign112 ]; then node tests/bridge-sign112-source.mjs; fi
            if [ '${{ steps.scope.outputs.target }}' = mik112 ]; then
              node tests/mik112-metric-geometry.mjs
              node tests/mik112-rail-layout.mjs
              node tests/bridge-sign112-source.mjs
            fi
          fi
      - name: Serve full museum candidate
        if: github.ref != 'refs/heads/main' && (steps.scope.outputs.target != 'energia-surface' || matrix.mode == 'desktop')
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mik112-server.log 2>&1 &
      - name: Verify the actual scene, mobile layout and workshop
        if: github.ref != 'refs/heads/main' && (steps.scope.outputs.target != 'energia-surface' || matrix.mode == 'desktop')
        env:
          QA_PREFIX: local
        run: node scripts/ci/run-bounded.mjs 720 mik112-local node tests/${{ steps.scope.outputs.target }}-browser.mjs
      - name: Record exact source without publishing
        if: startsWith(github.ref_name, 'fix/') && matrix.mode == 'desktop' && steps.scope.outputs.target != 'buran-launch' && steps.scope.outputs.target != 'energia-surface'
        run: |
          git diff --exit-code
          mkdir -p qa-mik112-release
          git rev-parse HEAD > qa-mik112-release/source-commit.txt
      - name: Record the launch revision without modifying source files
        if: github.ref != 'refs/heads/main' && (steps.scope.outputs.target == 'buran-launch' || steps.scope.outputs.target == 'energia-surface' && matrix.mode == 'desktop')
        run: |
          mkdir -p qa-mik112-release
          git rev-parse HEAD > qa-mik112-release/source-commit.txt
      - name: Verify published hashes and repeat actual browser acceptance
        if: github.ref == 'refs/heads/main' && (steps.scope.outputs.target != 'energia-surface' || matrix.mode == 'desktop')
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/
          QA_PREFIX: public
          VERIFY_PUBLIC: '1'
        run: |
          git diff --exit-code -- index.html museum.html workshop.html src data/road-signs.json
          node scripts/ci/run-bounded.mjs 720 mik112-public node tests/${{ steps.scope.outputs.target }}-browser.mjs
          mkdir -p qa-mik112-release
          git rev-parse HEAD > qa-mik112-release/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always() && (steps.scope.outputs.target != 'energia-surface' || matrix.mode == 'desktop')
        with:
          name: ${{ steps.scope.outputs.target == 'energia-surface' && 'energia-surface' || steps.scope.outputs.target == 'buran-launch' && 'buran-launch' || 'mik112' }}-${{ matrix.mode }}-evidence-attempt-${{ github.run_attempt }}
          path: |
            qa-mik112/
            qa-buran-loss/
            qa-buran-launch/
            qa-energia-surface/
            qa-bridge-sign112/
            qa-mik112-release/
            qa-ci/mik112-*.json
            qa-ci/mik112-*.log
          retention-days: 7
