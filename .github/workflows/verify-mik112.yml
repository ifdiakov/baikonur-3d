name: MIK112 historical reconstruction acceptance
on:
  push:
    branches: [main, fix/mik112-collapse-20261110]
    paths: ['src/mik112.js', 'src/mik112-collapse*.js', 'scripts/prepare-mik112-collapse.mjs', 'tests/mik112-collapse*.mjs', '.github/workflows/verify-mik112.yml']
  workflow_dispatch:
concurrency:
  group: museum-mik112-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  mik112:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the requested MIK change only
        run: |
          node scripts/prepare-mik112-collapse.mjs
          node --check src/mik112-collapse.js
          node --check src/mik112-collapse-sequence.js
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8').match(/<script type=\"module\"[^>]*>([\\s\\S]*?)<\\/script>/)[1];fs.writeFileSync('/tmp/mik-main.mjs',s)"
          node --check /tmp/mik-main.mjs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: museum-mik-playwright1.57.0-${{ runner.os }}
      - name: Install verification tools
        run: |
          npm install --no-save three@0.160.1 playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify building dimensions and deterministic collapse
        run: |
          node tests/mik112-metric-geometry.mjs
          node tests/mik112-rail-layout.mjs
          node tests/mik112-collapse-source.mjs
      - name: Serve exact candidate
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mik-server.log 2>&1 &
      - name: Check actual museum desktop mobile and workshop
        env:
          QA_OUT: qa-mik-collapse/local
        run: node scripts/ci/run-bounded.mjs 420 mik-local node tests/mik112-collapse-browser.mjs
      - name: Commit verified preparation on candidate only
        if: github.ref_name == 'fix/mik112-collapse-20261110'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html museum.html workshop.html src/mik112.js PROJECT_CONTEXT.md docs/WORK_STATUS.md
          if ! git diff --cached --quiet; then git commit -m 'MIK112: remove permanent hall exhibit and integrate verified historical scene'; git push origin HEAD:${{ github.ref_name }}; fi
          git rev-parse HEAD > qa-mik-collapse/source-commit.txt
      - name: Check the published revision after Pages delivery
        if: github.ref_name == 'main'
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/
          QA_OUT: qa-mik-collapse/public
          VERIFY_PUBLIC: '1'
        run: node scripts/ci/run-bounded.mjs 420 mik-public node tests/mik112-collapse-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mik112-collapse-evidence
          path: |
            qa-mik-collapse/
            qa-ci/mik-*.json
            qa-ci/mik-*.log
          retention-days: 7
