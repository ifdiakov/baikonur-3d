name: MIK112 model and reconstruction — verified integration
on:
  push:
    branches: [main, fix/buran-loss-integration-20261110, fix/bridge-sign112-20261110, fix/mik112-photo-20261110, fix/mik112-reference-20261111]
    paths: ['src/buran-loss*','src/mik112*.js','src/bridge-ground-surface.js','src/road-signs.js','data/road-signs.json','scripts/prepare-buran-loss.mjs','scripts/prepare-bridge-sign112.mjs','scripts/refine-mik112-callouts.mjs','scripts/ci/wait-pages-publication.mjs','tests/mik112-*.mjs','tests/buran-loss-*.mjs','tests/bridge-sign112-*.mjs','.github/workflows/verify-mik112.yml']
  workflow_dispatch:
concurrency:
  group: museum-mik112-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pages_publication:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for successful Pages publication of this exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/wait-pages-publication.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mik112-pages-gate-attempt-${{ github.run_attempt }}
          path: qa-ci/mik112-pages-publication.json
          retention-days: 7
  mik112:
    needs: pages_publication
    # An explicit status predicate lets candidates run after the skipped gate.
    if: ${{ !cancelled() && (github.ref != 'refs/heads/main' || needs.pages_publication.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, mobile, workshop]
    env:
      QA_MODES: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the relevant existing acceptance suite
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          target=buran-loss
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' || '${{ github.ref_name }}' == 'fix/mik112-photo-20261110' || '${{ github.ref_name }}' == 'fix/mik112-reference-20261111' ]]; then
            target=mik112
          elif [[ '${{ github.ref_name }}' == 'fix/bridge-sign112-20261110' ]]; then
            target=bridge-sign112
          elif [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            if git diff --name-only "$BEFORE" HEAD | grep -Eq '(^src/mik112(-materials|-photo-detail|-rail-plan)?\.js$|^tests/mik112-|^scripts/ci/wait-pages-publication\.mjs$|^\.github/workflows/verify-mik112\.yml$)'; then
              target=mik112
            elif git diff --name-only "$BEFORE" HEAD | grep -Eq '(^src/(bridge-ground-surface|mik112-cards|road-signs)\.js$|^data/road-signs\.json$|bridge-sign112|refine-mik112-callouts)'; then target=bridge-sign112; fi
          elif [[ -f src/mik112-cards.js ]]; then
            target=bridge-sign112
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Prepare the approved integration only
        run: |
          if [ '${{ steps.scope.outputs.target }}' != mik112 ]; then node scripts/prepare-buran-loss.mjs; fi
          if [ '${{ steps.scope.outputs.target }}' = bridge-sign112 ]; then
            node scripts/prepare-bridge-sign112.mjs
            node scripts/refine-mik112-callouts.mjs
          fi
          node --check src/buran-loss.js
          node --check src/buran-loss-scene.js
          if [ '${{ steps.scope.outputs.target }}' = mik112 ]; then
            node --check src/mik112.js
            node --check src/mik112-materials.js
            node --check src/mik112-photo-detail.js
          fi
          cmp index.html museum.html
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: museum-mik112-Linux-playwright1.57.0-three0.160.1
      - name: Install browser and run source checks
        run: |
          npm install --no-save playwright@1.57.0 three@0.160.1
          npx playwright install --with-deps chromium
          if [ '${{ matrix.mode }}' = desktop ]; then
            node tests/mik112-publish-gate.mjs
            node tests/buran-loss-source.mjs
            if [ '${{ steps.scope.outputs.target }}' = bridge-sign112 ]; then node tests/bridge-sign112-source.mjs; fi
            if [ '${{ steps.scope.outputs.target }}' = mik112 ]; then
              node tests/mik112-metric-geometry.mjs
              node tests/mik112-rail-layout.mjs
              node tests/bridge-sign112-source.mjs
            fi
          fi
      - name: Serve full museum candidate
        if: github.ref != 'refs/heads/main'
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mik112-server.log 2>&1 &
      - name: Verify the actual scene, mobile layout and workshop
        if: github.ref != 'refs/heads/main'
        env:
          QA_PREFIX: local
        run: node scripts/ci/run-bounded.mjs 720 mik112-local node tests/${{ steps.scope.outputs.target }}-browser.mjs
      - name: Record only verified prepared application files on the candidate
        if: startsWith(github.ref_name, 'fix/') && matrix.mode == 'desktop'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html museum.html workshop.html src/road-signs.js data/road-signs.json PROJECT_CONTEXT.md docs/WORK_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate verified bridge soil, Dirmentobe sign and separate MIK112 transporter cards'
            git push origin HEAD:${{ github.ref_name }}
          fi
          mkdir -p qa-mik112-release
          git rev-parse HEAD > qa-mik112-release/source-commit.txt
      - name: Verify published hashes and repeat actual browser acceptance
        if: github.ref == 'refs/heads/main'
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/
          QA_PREFIX: public
          VERIFY_PUBLIC: '1'
        run: |
          git diff --exit-code -- index.html museum.html workshop.html src data/road-signs.json
          node scripts/ci/run-bounded.mjs 720 mik112-public node tests/${{ steps.scope.outputs.target }}-browser.mjs
          mkdir -p qa-mik112-release
          git rev-parse HEAD > qa-mik112-release/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mik112-${{ matrix.mode }}-evidence-attempt-${{ github.run_attempt }}
          path: |
            qa-mik112/
            qa-buran-loss/
            qa-bridge-sign112/
            qa-mik112-release/
            qa-ci/mik112-*.json
            qa-ci/mik112-*.log
          retention-days: 7
