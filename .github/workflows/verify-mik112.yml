name: MIK112 and Buran loss — verified integration
on:
  push:
    branches: [main, fix/buran-loss-integration-20261110]
    paths: ['src/buran-loss*','scripts/prepare-buran-loss.mjs','tests/buran-loss-*.mjs','.github/workflows/verify-mik112.yml']
  workflow_dispatch:
concurrency:
  group: museum-mik112-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  mik112:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare only the approved MIK112 integration
        run: |
          node scripts/prepare-buran-loss.mjs
          node --check src/buran-loss.js
          node --check src/buran-loss-scene.js
          cmp index.html museum.html
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: museum-mik112-Linux-playwright1.57.0-three0.160.1
      - name: Install browser and source checks
        run: |
          npm install --no-save playwright@1.57.0 three@0.160.1
          npx playwright install --with-deps chromium
          node tests/buran-loss-source.mjs
      - name: Serve full museum candidate
        if: github.ref != 'refs/heads/main'
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/buran-loss-server.log 2>&1 &
      - name: Verify full museum, mobile and workshop before publication
        if: github.ref != 'refs/heads/main'
        env:
          QA_PREFIX: local
        run: node scripts/ci/run-bounded.mjs 480 buran-loss-local node tests/buran-loss-browser.mjs
      - name: Record only verified prepared entrypoints on the candidate
        if: github.ref_name == 'fix/buran-loss-integration-20261110'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html museum.html workshop.html PROJECT_CONTEXT.md docs/WORK_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate verified Buran loss into the complete museum and workshop'
            git push origin HEAD:${{ github.ref_name }}
          fi
          git rev-parse HEAD > qa-buran-loss/source-commit.txt
      - name: Check published files and repeat full browser acceptance
        if: github.ref == 'refs/heads/main'
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/
          QA_PREFIX: public
          VERIFY_PUBLIC: '1'
        run: |
          git diff --exit-code -- index.html museum.html workshop.html src
          node scripts/ci/run-bounded.mjs 480 buran-loss-public node tests/buran-loss-browser.mjs
          git rev-parse HEAD > qa-buran-loss/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buran-loss-integration-evidence
          path: |
            qa-buran-loss/
            qa-ci/buran-loss-*.json
            qa-ci/buran-loss-*.log
          retention-days: 7
