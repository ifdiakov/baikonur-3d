name: Railway terminus and site connections
on:
  push:
    branches: [main, fix/**]
    paths: ["src/rail-terminal-cleanup.js", "src/osm-transport.js", "src/rail-scheme.js", "tests/rail-terminal-cleanup.mjs", "tests/rail-site-gates-integration.mjs", "tests/access-rail-continuity.mjs", "data/osm/railways.geojson", "data/osm/rail-points.geojson", ".github/workflows/verify-rail-termini.yml", "package.json", "package-lock.json", "src/site31-observation-platform.js", "tests/helpers/qa-scope.mjs"]
  workflow_dispatch:
permissions:
  contents: read
# QA_MOBILE_EXCLUDED_BY_OWNER: not run, never reported as a mobile pass.
env:
  QA_SKIP_MOBILE: '1'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install geometry dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test OSM rail ends against stations and pads
        run: node tests/rail-terminal-cleanup.mjs
      - name: Test station scheme and complete rail geometry
        run: |
          node tests/rail-scheme.mjs
          node tests/rail-surface.mjs
          node tests/mik112-rail-layout.mjs
          node tests/site110-rail-fan.mjs
          node tests/rail-site-gates-integration.mjs
