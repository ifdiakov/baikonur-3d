# CI_RELIABILITY_V1
name: RocketTrip observation platform
on:
  push:
    branches: [main, codex/np-redraw, fix/ci-repair-20261114]
    paths: ['index.html', 'src/site31-observation-platform.js', 'src/osm-transport.js', 'tests/fixtures/np-photo.html', 'src/evening-scene.js', 'tests/site31-observation*.mjs', '.github/workflows/verify-site31-np.yml']
  pull_request:
    branches: [main]
    paths: ['index.html', 'src/site31-observation-platform.js', 'src/osm-transport.js', 'tests/fixtures/np-photo.html', 'src/evening-scene.js', 'tests/site31-observation*.mjs', '.github/workflows/verify-site31-np.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site31-np-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select relevant checks before downloading tools
        id: ci_scope
        run: node scripts/ci/impact.mjs verify-site31-np.yml
      - uses: actions/setup-node@v4
        if: steps.ci_scope.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Reuse downloaded verification dependencies
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: museum-npm-${{ runner.os }}-v1-${{ hashFiles('package-lock.json') }}
      - name: Reuse matching browser binaries
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: museum-playwright-${{ runner.os }}-1.57.0-${{ hashFiles('package-lock.json') }}
      - name: Install geometry and browser tooling
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check the NP layout and road-adjacent placement
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          node --check src/site31-observation-platform.js
          node tests/site31-observation.mjs
      - name: Serve the museum
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
      - name: Check NP in the 3D museum
        if: steps.ci_scope.outputs.run == 'true'
        run: node tests/site31-observation-browser.mjs
      - uses: actions/upload-artifact@v4
        if: (always()) && (steps.ci_scope.outputs.run == 'true')
        with:
          name: site31-observation-visuals
          path: qa-site31-np/
