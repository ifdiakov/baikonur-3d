name: Refresh Syr Darya hydrography from OpenStreetMap
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_syrdarya.py'
      - '.github/workflows/river-geodata.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-hydrography:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query OSM and align river to Baikonur's historical diagram
        run: python scripts/build_syrdarya.py
      - name: Validate geographic coverage and provenance
        run: |
          python - <<'PY'
          import json
          o=json.load(open('data/syrdarya-river.json'))
          xs=[p[0] for p in o['mapPoints']]
          assert len(xs)>20 and min(xs)<0 and max(xs)>1300
          assert o['source'].startswith('OpenStreetMap') and o['license'].startswith('Open Database License')
          print('Syr Darya OSM geodata verified:',len(xs),'points, range',min(xs),max(xs))
          PY
      - name: Commit verified river coordinates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/syrdarya-river.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: add OSM-sourced Syr Darya geometry beyond museum map"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          echo "River geometry commit could not be pushed"
          exit 1
