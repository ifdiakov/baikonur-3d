# CI_RELIABILITY_V1
name: Verify baked transport fast boot
on:
  push:
    branches: [main]
    paths:
      - 'data/osm/transport-geometry-bake-v1.json.gz'
      - 'src/transport-bake.js'
      - 'src/road-lod.js'
      - 'src/road-editor.js'
      - 'index.html'
      - 'data/osm/road-lod-authoritative-v1.json.gz'
      - 'tests/road-lod-authoritative.mjs'
      - 'tests/transport-cache-browser.mjs'
      - '.github/workflows/verify-transport-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select relevant checks before downloading tools
        id: ci_scope
        run: node scripts/ci/impact.mjs verify-transport-cache.yml
      - uses: actions/setup-node@v4
        if: steps.ci_scope.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Reuse downloaded verification dependencies
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: museum-npm-${{ runner.os }}-v1
      - name: Reuse matching browser binaries
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: museum-playwright-${{ runner.os }}-1.57.0
      - name: Install test browser
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          npm install --no-save playwright@1.57.0 three@0.160.1
          npx playwright install --with-deps chromium
      - name: Check transport and LOD contracts
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          node tests/transport-bake.mjs
          node tests/road-prebuilt-lod.mjs
          node tests/road-lod-authoritative.mjs
      - name: Check real cached initialization
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node tests/transport-cache-browser.mjs
