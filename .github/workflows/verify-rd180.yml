# CI_RELIABILITY_V1
name: RD-180 model and linked cards
on:
  push:
    branches: [main, codex/rd180, fix/**]
    paths: ["assets/models/rd180/**", "src/rd180-facts.js", "src/model-*.js", "src/model-viewer.css", "src/inspection-models.js", "src/museum-menu.js", "src/encyclopedia-3d.js", "index.html", "encyclopedia.html", "data/encyclopedia.json", "tests/rd180-*.mjs", ".github/workflows/verify-rd180.yml", "tests/menu-catalog-contract.mjs", "tests/helpers/menu-markup.mjs", "package.json", "package-lock.json", "tests/helpers/qa-scope.mjs"]
  workflow_dispatch:
permissions:
  contents: read
# QA_MOBILE_EXCLUDED_BY_OWNER: not run, never reported as a mobile pass.
env:
  QA_SKIP_MOBILE: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select relevant checks before downloading tools
        id: ci_scope
        run: node scripts/ci/impact.mjs verify-rd180.yml
      - uses: actions/setup-node@v4
        if: steps.ci_scope.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Reuse downloaded verification dependencies
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: museum-npm-${{ runner.os }}-v1-${{ hashFiles('package-lock.json') }}
      - name: Reuse matching browser binaries
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: museum-playwright-${{ runner.os }}-1.57.0-${{ hashFiles('package-lock.json') }}
      - name: Install test dependencies
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify source and catalogues
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          node tests/rd180-source.mjs
          node tests/menu-catalog-contract.mjs
          node tests/encyclopedia-media-data.mjs
          node tests/soyuz5-source.mjs
          node tests/proton-source.mjs
      - name: Serve checkout
        if: steps.ci_scope.outputs.run == 'true'
        run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Verify WebGL, views, mobile and related navigation
        if: steps.ci_scope.outputs.run == 'true'
        run: node tests/rd180-browser.mjs
      - uses: actions/upload-artifact@v4
        if: (always()) && (steps.ci_scope.outputs.run == 'true')
        with:
          name: rd180-evidence
          path: qa-rd180/
