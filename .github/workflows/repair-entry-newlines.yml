name: Repair museum entry syntax
on:
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore real newlines in the KAZ initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          lines = s.splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if 'Main north-south axis follows the adjacent cosmodrome arterial' in line]
          assert len(matches) == 1, 'KAZ initialization anchor must be unique'
          i = matches[0]
          if r'\n' in lines[i]:
              lines[i] = lines[i].replace(r'\n', '\n')
              s = ''.join(lines)
              p.write_text(s)
          start = s.index('<script type="module">') + len('<script type="module">')
          end = s.index('</script>', start)
          Path('/tmp/museum-entry.mjs').write_text(s[start:end])
          PY
          node --check /tmp/museum-entry.mjs
      - name: Record exact source without publishing
        run: |
          mkdir -p qa-proposal
          git rev-parse HEAD > qa-proposal/source-commit.txt
          git diff --binary > qa-proposal/proposal.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-proposal
          path: qa-proposal/
          retention-days: 7
