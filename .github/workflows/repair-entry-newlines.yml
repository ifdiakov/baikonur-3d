name: Repair museum entry syntax
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-entry-newlines.yml']
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore real newlines in the KAZ initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          lines = s.splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if 'Main north-south axis follows the adjacent cosmodrome arterial' in line]
          assert len(matches) == 1, 'KAZ initialization anchor must be unique'
          i = matches[0]
          if r'\n' in lines[i]:
              lines[i] = lines[i].replace(r'\n', '\n')
              s = ''.join(lines)
              p.write_text(s)
          start = s.index('<script type="module">') + len('<script type="module">')
          end = s.index('</script>', start)
          Path('/tmp/museum-entry.mjs').write_text(s[start:end])
          PY
          node --check /tmp/museum-entry.mjs
      - name: Commit the scoped syntax repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix KAZ escaped newlines so the museum JavaScript loads"
          git pull --rebase origin main
          git push origin HEAD:main
