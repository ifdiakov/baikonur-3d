name: Site 113 housing district
on:
  pull_request:
    branches: [main]
    paths: ["src/site113*.js", "src/osm-transport.js", "src/road-lod.js", "src/transport-bake.js", "tests/site113-*.mjs", ".github/workflows/verify-site113.yml", "package.json", "package-lock.json", "scripts/verify-site113-published.mjs", "tests/helpers/qa-scope.mjs"]
  push:
    branches: [main, fix/**]
    paths: ["src/site113*.js", "src/osm-transport.js", "src/road-lod.js", "src/transport-bake.js", "tests/site113-*.mjs", ".github/workflows/verify-site113.yml", "package.json", "package-lock.json", "scripts/verify-site113-published.mjs", "tests/helpers/qa-scope.mjs"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site113-${{ github.ref }}
  cancel-in-progress: true
# QA_MOBILE_EXCLUDED_BY_OWNER: not run, never reported as a mobile pass.
env:
  QA_SKIP_MOBILE: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Validate source geometry and performance budget
        run: node tests/site113-source.mjs
      - name: Serve checkout
        run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Inspect town views in museum and on mobile
        run: node tests/site113-browser.mjs
      - name: Verify live deployment and repeat browser check
        if: github.ref == 'refs/heads/main'
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/
          QA_PREFIX: public
        run: |
          node scripts/verify-site113-published.mjs
          node tests/site113-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site113-evidence
          path: qa-site113/
