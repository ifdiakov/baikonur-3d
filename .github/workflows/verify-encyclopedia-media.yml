name: Card sharing and encyclopedia media
on:
  push:
    branches: [main, fix/share-copy-20261111, fix/ci-repair-20261114]
    paths: ['src/card-share*', 'src/model-viewer.js', 'src/model-inspector.js', 'encyclopedia.html', 'workshop/model.html', 'tests/card-share-*.mjs', 'data/encyclopedia.json', 'src/encyclopedia-3d.js', '.github/workflows/verify-encyclopedia-media.yml']
  pull_request:
    branches: [main]
    paths: ['src/card-share*', 'src/model-viewer.js', 'src/model-inspector.js', 'encyclopedia.html', 'workshop/model.html', 'tests/card-share-*.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: encyclopedia-media-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --experimental-vm-modules scripts/ci/fast-check.mjs
          node tests/encyclopedia-media-data.mjs
          node tests/card-share-source.mjs
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: share-source
          path: qa-card-share/
          retention-days: 7
  sharing:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, mobile, workshop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: museum-share-copy-${{ runner.os }}-playwright1.57.0-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            museum-playwright-${{ runner.os }}-1.57.0
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Serve the exact candidate, without generated edits
        if: github.ref != 'refs/heads/main'
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/share-http.log 2>&1 &
      - name: Verify real copy, toast, object links and preserved UI
        env:
          QA_MODE: ${{ matrix.mode }}
          BAIKONUR_URL: ${{ github.ref == 'refs/heads/main' && 'https://ifdiakov.github.io/baikonur-3d/' || 'http://127.0.0.1:8765/' }}
          VERIFY_PUBLIC: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: node scripts/ci/run-bounded.mjs 480 card-share-${{ matrix.mode }} node tests/card-share-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: share-${{ matrix.mode }}
          path: |
            qa-card-share/
            qa-ci/card-share-*.json
            qa-ci/card-share-*.log
          retention-days: 7
  media-regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 &
      - run: node tests/encyclopedia-media-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encyclopedia-media-visuals
          path: qa-encyclopedia-media/
