# CI_RELIABILITY_V1
name: Verify fast Baikonur loading
on:
  push:
    branches: [main, fix/**]
    paths: ["src/museum-menu.js", "src/complex-history-menu.js", "src/osm-transport.js", "src/transport-bake.js", "tests/transport-bake.mjs", "src/road-surface.js", "index.html", "src/ukss-exhibit.js", "src/tua-exhibit.js", "tests/loading-*", "tests/menu-catalog-contract.mjs", "tests/onboarding-flank-flyover.mjs", "src/museum-onboarding.js", ".github/workflows/verify-loading-optimization.yml", "tests/helpers/menu-markup.mjs", "package.json", "package-lock.json"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select relevant checks before downloading tools
        id: ci_scope
        run: node scripts/ci/impact.mjs verify-loading-optimization.yml
      - uses: actions/setup-node@v4
        if: steps.ci_scope.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Reuse downloaded verification dependencies
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: museum-npm-${{ runner.os }}-v1-${{ hashFiles('package-lock.json') }}
      - name: Reuse matching browser binaries
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: museum-playwright-${{ runner.os }}-1.57.0-${{ hashFiles('package-lock.json') }}
      - name: Install geometry and browser tests
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify optimized load path and history contracts
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          node tests/transport-bake.mjs
          node tests/road-prebuilt-lod.mjs
          node tests/loading-optimization.mjs
          node tests/complex-history.mjs
          node tests/menu-catalog-contract.mjs
      - name: Profile actual first frame and on-demand history
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node tests/loading-profile-browser.mjs
      - uses: actions/upload-artifact@v4
        if: (always()) && (steps.ci_scope.outputs.run == 'true')
        with:
          name: loading-profile
          path: qa-loading/
