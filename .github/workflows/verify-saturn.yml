name: Saturn IP-5 3D model — isolated browser verification
# Historical schematic checks are retained for manual inspection.
# The OSM live product is checked and released by verify-osm-release.yml.
on:
  workflow_dispatch:
concurrency:
  group: baikonur-3d-saturn-check
  cancel-in-progress: true
jobs:
  saturn:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium smoke dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start local museum webserver
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
      - name: Verify Saturn model in Chromium
        id: local
        run: |
          set -o pipefail
          node tests/saturn-smoke.mjs 2>&1 | tee /tmp/saturn-local.log
      - name: Await actual public GitHub Pages build
        id: publish
        if: always()
        run: |
          set -e
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 20 "https://ifdiakov.github.io/baikonur-3d/?preview=saturn&check=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/saturn-public.html \
              && grep -Fq "buildSaturnIP5" /tmp/saturn-public.html \
              && curl -fsSL --max-time 20 "https://ifdiakov.github.io/baikonur-3d/workshop/saturn.html?check=${GITHUB_SHA}&attempt=${attempt}" | grep -Fq '__SATURN_PREVIEW__' \
              && curl -fsSL --max-time 20 "https://ifdiakov.github.io/baikonur-3d/src/saturn-ip5.js?check=${GITHUB_SHA}&attempt=${attempt}" | grep -Fq "1.7-readable-relief-lighting" \
              && curl -fsSL --max-time 20 "https://ifdiakov.github.io/baikonur-3d/data/catalog.json?check=${GITHUB_SHA}&attempt=${attempt}" | grep -Fq "saturn-ms-photo-v1"; then
              echo "Saturn model and 98-site catalog are published"
              exit 0
            fi
            echo "Waiting for current Saturn public asset: attempt ${attempt}"
            sleep 8
          done
          echo "Public Saturn assets not confirmed";exit 1
      - name: Verify PUBLIC Saturn model in Chromium
        id: publicbrowser
        if: always() && steps.publish.outcome == 'success'
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/?museum3=${{ github.sha }}
        run: |
          set -o pipefail
          node tests/saturn-smoke.mjs 2>&1 | tee /tmp/saturn-public.log
      - name: Archive screenshots and reproducible source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saturn-ip5-qa
          path: |
            qa-saturn-ip5.png
            index.html
            src/
            data/*.json
            assets/
            baykonur-plan.png
          if-no-files-found: ignore
      - name: Record exact source without publishing
        if: always()
        env:
          LOCAL: ${{ steps.local.outcome }}
          PUBLIC: ${{ steps.publish.outcome }}
          PUBLIC_BROWSER: ${{ steps.publicbrowser.outcome }}
          TARGET: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git diff --exit-code
