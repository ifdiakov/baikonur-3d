name: Sprinter source and road motion
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'assets/models/sprinter/**'
      - 'src/sprinter-source.js'
      - 'src/road-vehicles.js'
      - 'src/ground-traffic.js'
      - 'tests/sprinter-*.mjs'
      - '.github/workflows/verify-sprinter.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprinter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependencies
        run: |
          npm install --no-save three@0.160.1 meshoptimizer@0.25.0 playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Check model, wheel pivots and recovery
        run: |
          node tests/sprinter-source.mjs
          node tests/road-vehicles-geometry.mjs
          node tests/road-editor-startup.mjs
      - name: Serve checkout
        run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Full museum, Sprinter motion, retry, day, night and mobile
        timeout-minutes: 7
        run: node tests/sprinter-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprinter-evidence
          path: |
            qa-sprinter/*.png
            qa-sprinter/*.json
