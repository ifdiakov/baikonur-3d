name: Sprinter source and road motion
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/**]
    paths: ["assets/models/sprinter/**", "src/sprinter-source.js", "src/road-vehicles.js", "src/ground-traffic.js", "tests/sprinter-*.mjs", ".github/workflows/verify-sprinter.yml", "package.json", "package-lock.json", "scripts/verify-sprinter-published.mjs"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprinter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BAIKONUR_URL: ${{ github.ref != 'refs/heads/main' && 'http://127.0.0.1:8765/' || 'https://ifdiakov.github.io/baikonur-3d/' }}
      QA_PREFIX: ${{ github.ref != 'refs/heads/main' && 'local' || 'public' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check model, wheel pivots and recovery
        run: |
          node tests/sprinter-source.mjs
          node tests/road-vehicles-geometry.mjs
          node tests/road-editor-startup.mjs
      - name: Serve checkout
        run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Verify the published model and entry point
        if: github.ref == 'refs/heads/main'
        run: node scripts/verify-sprinter-published.mjs
      - name: Full museum, Sprinter motion, retry, day, night and mobile
        timeout-minutes: 7
        run: |
          node tests/sprinter-detail-browser.mjs
          node tests/sprinter-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprinter-evidence
          path: |
            qa-sprinter/*.png
            qa-sprinter/*.json
