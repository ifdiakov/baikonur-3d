name: Museum 3D browser smoke test
# Historical schematic checks are retained for manual inspection.
# The OSM live product is checked and released by verify-osm-release.yml.
on:
  workflow_dispatch:
concurrency:
  group: baikonur-3d-browser-smoke
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        id: install
        run: |
          set -o pipefail
          npm install --no-save playwright@1.57.0 2>&1 | tee /tmp/baikonur-browser-install.log
          npx playwright install --with-deps chromium 2>&1 | tee -a /tmp/baikonur-browser-install.log
      - name: Start museum site
        id: server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
      - name: Smoke test - Three.js and semantic zoom
        id: browser
        run: |
          set -o pipefail
          node tests/smoke.mjs 2>&1 | tee /tmp/baikonur-test.log
      - name: Verify published GitHub Pages contains current museum
        id: public
        if: always()
        run: node scripts/verify-published.mjs
      - name: Open published 3D museum in Chromium and test interaction
        id: publicbrowser
        if: always() && steps.public.outcome == 'success'
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/?browser-qa=${{ github.sha }}
        run: |
          set -o pipefail
          node tests/smoke.mjs 2>&1 | tee /tmp/baikonur-public-browser.log
      - name: Save diagnostic screenshots and logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baikonur-3d-checks
          path: |
            qa-*.png
            /tmp/baikonur-browser-install.log
            /tmp/baikonur-test.log
            /tmp/baikonur-public-browser.log
          if-no-files-found: ignore
          retention-days: 7

