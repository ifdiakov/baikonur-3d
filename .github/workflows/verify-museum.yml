name: Museum 3D browser smoke test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/verify-museum.yml'
  workflow_dispatch:
concurrency:
  group: baikonur-3d-browser-smoke
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        id: install
        run: |
          set -o pipefail
          npm install --no-save playwright@1.57.0 2>&1 | tee /tmp/baikonur-browser-install.log
          npx playwright install --with-deps chromium 2>&1 | tee -a /tmp/baikonur-browser-install.log
      - name: Start museum site
        id: server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
      - name: Smoke test - Three.js and semantic zoom
        id: browser
        run: |
          set -o pipefail
          node tests/smoke.mjs 2>&1 | tee /tmp/baikonur-test.log
      - name: Verify published GitHub Pages contains current museum
        id: public
        if: always()
        run: |
          set -e
          for attempt in $(seq 1 20); do
            if curl --connect-timeout 8 --max-time 22 -fsSL "https://ifdiakov.github.io/baikonur-3d/?check=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/baikonur-public.html && grep -q 'id="timeDock"' /tmp/baikonur-public.html && grep -q 'rockettrip-logo.svg' /tmp/baikonur-public.html && grep -q 'buildGagarinPad' /tmp/baikonur-public.html && curl --connect-timeout 8 --max-time 15 -fsSL "https://ifdiakov.github.io/baikonur-3d/src/gagarin-pad.js?check=${GITHUB_SHA}&attempt=${attempt}" | grep -q "version:'3.0'" && curl --connect-timeout 8 --max-time 15 -fsSL 'https://ifdiakov.github.io/baikonur-3d/assets/rockettrip-logo.svg' | grep -q 'data:image/png;base64'; then
              echo "Published museum includes the updated Gagarin 3D model and RocketTrip branding"
              exit 0
            fi
            echo "GitHub Pages not updated yet: attempt $attempt"
            sleep 10
          done
          echo "Current museum update was not verified on the published URL"
          exit 1
      - name: Open published 3D museum in Chromium and test interaction
        id: publicbrowser
        if: always() && steps.public.outcome == 'success'
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/?browser-qa=${{ github.sha }}
        run: |
          set -o pipefail
          node tests/smoke.mjs 2>&1 | tee /tmp/baikonur-public-browser.log
      - name: Save 4 level screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baikonur-3d-checks
          path: qa-*.png
          if-no-files-found: ignore

      - name: Record check result in repository
        if: always()
        env:
          SMOKE_STATUS: ${{ steps.browser.outcome }}
          TARGET_SHA: ${{ github.sha }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          SERVER_STATUS: ${{ steps.server.outcome }}
          PUBLIC_STATUS: ${{ steps.public.outcome }}
          PUBLIC_BROWSER_STATUS: ${{ steps.publicbrowser.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p data
          node -e 'const fs=require("fs");fs.writeFileSync("data/qa-status.json",JSON.stringify({targetCommit:process.env.TARGET_SHA,status:process.env.SMOKE_STATUS||"not-run",install:process.env.INSTALL_STATUS,server:process.env.SERVER_STATUS,public:process.env.PUBLIC_STATUS,publicBrowser:process.env.PUBLIC_BROWSER_STATUS,runId:process.env.RUN_ID,checkedAt:new Date().toISOString(),test:"Browser-based Playwright smoke check"},null,2))'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f /tmp/baikonur-browser-install.log ]; then tail -n 80 /tmp/baikonur-browser-install.log > data/qa-install.log; fi
          if [ -f /tmp/baikonur-test.log ]; then tail -n 140 /tmp/baikonur-test.log > data/qa-test.log; fi
          if [ -f /tmp/baikonur-public-browser.log ]; then tail -n 130 /tmp/baikonur-public-browser.log > data/qa-public-browser.log; fi
          git add data/qa-status.json data/qa-install.log data/qa-test.log data/qa-public-browser.log 2>/dev/null || git add data/qa-status.json
          git diff --cached --quiet || git commit -m "ci: update Baikonur museum browser check result"
          git push
