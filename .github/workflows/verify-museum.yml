name: Museum 3D browser smoke test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/verify-museum.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        id: install
        run: |
          set -o pipefail
          npm install --no-save playwright@1.57.0 2>&1 | tee /tmp/baikonur-browser-install.log
          npx playwright install --with-deps chromium 2>&1 | tee -a /tmp/baikonur-browser-install.log
      - name: Start museum site
        id: server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
      - name: Smoke test - Three.js and semantic zoom
        id: browser
        run: node tests/smoke.mjs
      - name: Save 4 level screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baikonur-3d-checks
          path: qa-*.png
          if-no-files-found: ignore

      - name: Record check result in repository
        if: always()
        env:
          SMOKE_STATUS: ${{ steps.browser.outcome }}
          TARGET_SHA: ${{ github.sha }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          SERVER_STATUS: ${{ steps.server.outcome }}
        run: |
          mkdir -p data
          node -e 'const fs=require("fs");fs.writeFileSync("data/qa-status.json",JSON.stringify({targetCommit:process.env.TARGET_SHA,status:process.env.SMOKE_STATUS||"not-run",install:process.env.INSTALL_STATUS,server:process.env.SERVER_STATUS,checkedAt:new Date().toISOString(),test:"Browser-based Playwright smoke check"},null,2))'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f /tmp/baikonur-browser-install.log ]; then tail -n 80 /tmp/baikonur-browser-install.log > data/qa-install.log; fi
          git add data/qa-status.json data/qa-install.log 2>/dev/null || git add data/qa-status.json
          git diff --cached --quiet || git commit -m "ci: update Baikonur museum browser check result"
          git push
