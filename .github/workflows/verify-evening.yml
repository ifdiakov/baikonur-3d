name: Evening lighting and Krayniy arrival
# Historical schematic checks are retained for manual inspection.
# The OSM live product is checked and released by verify-osm-release.yml.
on:
  workflow_dispatch:
concurrency:
  group: baikonur-evening
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and geometry dependencies
        run: |
          npm install --no-save playwright@1.57.0 three@0.160.1
          npx playwright install --with-deps chromium
      - name: Verify continuous approach and runway contact
        run: node tests/arrival-geometry.mjs
      - name: Start local museum
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
      - name: Verify evening lights and flight in Chromium
        run: node tests/evening-browser.mjs
      - name: Wait for public arrival module
        run: node scripts/verify-published.mjs
      - name: Verify published evening museum
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/?aircraft=${{ github.sha }}
          QA_PREFIX: public
        run: node tests/evening-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evening-arrival-qa
          path: qa-evening/
