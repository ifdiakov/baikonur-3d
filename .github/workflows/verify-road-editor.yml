name: Live road editor smoke check
on:
  push:
    branches: [main]
    paths:
      - 'src/road-editor.js'
      - 'src/road-editor-core.js'
      - 'src/road-editor-mesh.js'
      - 'src/road-mask-tiles.js'
      - 'tests/road-mask-tiles.mjs'
      - 'data/road-edits-authoritative-20261103.json'
      - 'src/road-editor.css'
      - 'src/osm-transport.js'
      - 'tests/road-editor-*.mjs'
      - '.github/workflows/verify-road-editor.yml'
      - 'index.html'
  workflow_dispatch:
concurrency:
  group: rockettrip-road-editor-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and deterministic road editing
        run: |
          node --check src/road-editor.js
          node --check src/road-editor-core.js
          node --check src/road-mask-tiles.js
          node tests/road-editor-core.mjs
          node tests/road-mask-tiles.mjs
      - name: Install 3D browser dependencies
        run: |
          npm install --no-save playwright@1.57.0 three@0.160.1
          npx playwright install --with-deps chromium
      - name: Verify repaired road mesh topology
        run: node tests/road-editor-mesh.mjs
      - name: Serve checkout
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/baikonur-road-editor.log 2>&1 &
          curl --retry 6 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:8765/ --output /dev/null
      - name: Browser test for visible editor and saved changes
        run: node tests/road-editor-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: road-editor-qa
          path: qa-road-editor/
