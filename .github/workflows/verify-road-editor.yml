# CI_RELIABILITY_V1
name: Workshop road and railway editor — verified
on:
  push:
    branches: [main, fix/workshop-network-20261110, fix/ci-repair-20261114]
    paths: ['src/road-editor.js', 'src/road-editor-core.js', 'src/road-editor-mesh.js', 'src/road-junction-repair.js', 'tests/road-junction-repair.mjs', 'src/road-geometry-cut.js', 'tests/road-geometry-cut.mjs', 'src/road-editor-style.js', 'src/road-mask-tiles.js', 'tests/road-mask-tiles.mjs', 'data/road-edits-authoritative-20261103.json', 'src/road-editor.css', 'src/osm-transport.js', 'tests/road-editor-*.mjs', '.github/workflows/verify-road-editor.yml', 'index.html', 'workshop.html', 'src/workshop-*.js', 'src/workshop-panel.css', 'tests/workshop-network-*.mjs', 'scripts/prepare-workshop-network.mjs']
  workflow_dispatch:
concurrency:
  group: rockettrip-road-editor-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select relevant checks before downloading tools
        id: ci_scope
        env:
          CI_BASE: ${{ github.ref_name == 'fix/workshop-network-20261110' && '9077978c12ec6026bcce2ad57980ca430bd516a6' || '' }}
        run: |
          node scripts/ci/impact.mjs verify-road-editor.yml
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('qa-ci/impact-verify-road-editor.yml.json'));
          const all=!r.meaningful||process.env.GITHUB_EVENT_NAME==='workflow_dispatch';
          const network=all||r.meaningful.some(p=>p==='workshop.html'||p.startsWith('src/workshop-')||p.startsWith('tests/workshop-network-')||p==='scripts/prepare-workshop-network.mjs');
          const legacy=all||r.meaningful.some(p=>p==='index.html'||p==='src/osm-transport.js'||p.startsWith('src/road-')||p.startsWith('tests/road-')||p.startsWith('data/road-edits-'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`network=${network}\nlegacy=${legacy}\n`);
          JS
      - uses: actions/setup-node@v4
        if: steps.ci_scope.outputs.run == 'true'
        with:
          node-version: '22'
      - uses: actions/cache@v4
        if: steps.ci_scope.outputs.run == 'true'
        with:
          path: ~/.npm
          key: museum-npm-${{ runner.os }}-v1-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v4
        if: steps.ci_scope.outputs.run == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: museum-playwright-${{ runner.os }}-1.57.0-${{ hashFiles('package-lock.json') }}
      - name: Prepare admin-only network controls
        if: steps.ci_scope.outputs.run == 'true' && steps.ci_scope.outputs.network == 'true'
        run: git diff --exit-code
      - name: Install 3D browser dependencies
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Legacy scheme checks retained for relevant source changes
        if: steps.ci_scope.outputs.run == 'true' && steps.ci_scope.outputs.legacy == 'true'
        run: |
          node --check src/road-editor.js
          node --check src/road-editor-core.js
          node --check src/road-junction-repair.js
          node --check src/road-mask-tiles.js
          node --check src/road-editor-style.js
          node tests/road-editor-style.mjs
          node tests/road-editor-core.mjs
          node tests/road-mask-tiles.mjs
          node tests/road-editor-mesh.mjs
      - name: Verify physical source cuts and junction restoration
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          node tests/road-junction-repair.mjs
          node tests/road-geometry-cut.mjs
      - name: Verify network topology, rail meshes, project compatibility and scope
        if: steps.ci_scope.outputs.run == 'true' && steps.ci_scope.outputs.network == 'true'
        run: node tests/workshop-network-source.mjs
      - name: Serve checkout
        if: steps.ci_scope.outputs.run == 'true' && (github.ref != 'refs/heads/main' || steps.ci_scope.outputs.legacy == 'true')
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/baikonur-road-editor.log 2>&1 &
          curl --retry 6 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:8765/ --output /dev/null
      - name: Legacy browser check when affected
        if: steps.ci_scope.outputs.run == 'true' && steps.ci_scope.outputs.legacy == 'true'
        run: node tests/road-editor-browser.mjs
      - name: Candidate actual mouse editing, deletion, undo and persistence
        if: steps.ci_scope.outputs.run == 'true' && steps.ci_scope.outputs.network == 'true' && github.ref != 'refs/heads/main'
        env:
          QA_PREFIX: local
        run: node scripts/ci/run-bounded.mjs 600 workshop-network-local node tests/workshop-network-browser.mjs
      - name: Record exact source without publishing
        if: github.ref_name == 'fix/workshop-network-20261110'
        run: |
          git diff --exit-code
      - name: Verify published files and repeat actual workshop acceptance
        if: steps.ci_scope.outputs.run == 'true' && steps.ci_scope.outputs.network == 'true' && github.ref == 'refs/heads/main'
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/
          QA_PREFIX: public
          VERIFY_PUBLIC: '1'
        run: |
          git diff --exit-code -- workshop.html src
          node scripts/ci/run-bounded.mjs 720 workshop-network-public node tests/workshop-network-browser.mjs
          git rev-parse HEAD > qa-workshop-network/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always() && steps.ci_scope.outputs.run == 'true'
        with:
          name: road-editor-qa
          path: |
            qa-road-editor/
            qa-workshop-network/
            qa-ci/workshop-network-*.json
            qa-ci/workshop-network-*.log
          retention-days: 7
