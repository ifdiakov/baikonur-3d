# CI_RELIABILITY_V1
name: Site 31 source model
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/**]
    paths: ["index.html", "src/archive-models.js", "assets/models/site31/**", "src/site31-*.js", "src/gagarin-*.js", "src/soyuz-*.js", "src/terrain-voids.js", "tests/soyuz-*.mjs", "tests/gagarin-source-table.mjs", "tests/site31-geometry.mjs", "tests/site31-source-*.mjs", ".github/workflows/verify-site31.yml", "package.json", "package-lock.json", "tests/helpers/qa-scope.mjs"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site31-source-model-${{ github.ref }}
  cancel-in-progress: true
# QA_MOBILE_EXCLUDED_BY_OWNER: not run, never reported as a mobile pass.
env:
  QA_SKIP_MOBILE: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select relevant checks before downloading tools
        id: ci_scope
        run: node scripts/ci/impact.mjs verify-site31.yml
      - uses: actions/setup-node@v4
        if: steps.ci_scope.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Reuse downloaded verification dependencies
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: museum-npm-${{ runner.os }}-v1-${{ hashFiles('package-lock.json') }}
      - name: Reuse matching browser binaries
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: museum-playwright-${{ runner.os }}-1.57.0-${{ hashFiles('package-lock.json') }}
      - name: Install checks
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify source geometry and preserved connections
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          node tests/road-editor-startup.mjs
          node tests/site31-source-model.mjs
          node tests/site31-geometry.mjs
          node tests/site31-added-lighting.mjs
          node tests/gagarin-source-table.mjs
          node tests/soyuz-launch-scale.mjs
          node tests/soyuz-excavation-rim.mjs
      - name: Serve checkout
        if: steps.ci_scope.outputs.run == 'true'
        run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Test full museum, load recovery, views and mobile
        if: steps.ci_scope.outputs.run == 'true'
        timeout-minutes: 7
        run: node tests/site31-source-browser.mjs
      - name: Verify published version and repeat browser checks
        if: (github.ref == 'refs/heads/main') && (steps.ci_scope.outputs.run == 'true')
        env:
          BAIKONUR_URL: https://museum.rockettrip.space/
          QA_PREFIX: public
        run: |
          node scripts/verify-site31-published.mjs
          node tests/site31-source-browser.mjs
      - uses: actions/upload-artifact@v4
        if: (always()) && (steps.ci_scope.outputs.run == 'true')
        with:
          name: site31-source-evidence
          path: qa-site31/
