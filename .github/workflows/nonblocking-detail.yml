# CI_RELIABILITY_V2
name: Fast source and scene checks
on:
  push:
    branches: [main, 'fix/**', fix/ci-repair-20261114]
    paths: ['index.html', 'museum.html', 'workshop.html', 'src/**', 'data/**', 'assets/**', 'scripts/ci/fast-check.mjs', 'scripts/apply-map-group-removal.mjs', 'scripts/apply-camera-labels.mjs', 'scripts/prepare-onboarding-ukss.mjs', 'tests/onboarding-*.mjs', 'tests/camera-labels-*.mjs', 'tests/map-group-removal-*.mjs', 'tests/delivery-smoke.mjs', 'tests/security-*.mjs', 'tests/delivery-policy.mjs', 'tests/ci-reliability.mjs', '.github/workflows/nonblocking-detail.yml', 'scripts/ci/**', 'package.json', 'package-lock.json', 'tests/helpers/**', 'tests/ci-contracts.mjs', 'tests/menu-catalog-contract.mjs', 'tests/transport-ground-contact-browser-checks.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
      camera: ${{ steps.scope.outputs.camera }}
      tour: ${{ steps.scope.outputs.tour }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select targeted camera and tour acceptance
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          profile=1
          tour=1
          if [ "$EVENT_NAME" != 'workflow_dispatch' ] && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            profile=0
            tour=0
            if git diff --name-only "$BEFORE" HEAD | grep -Eq '(map-view-policy|camera-navigation|airport-views|apply-camera-labels|camera-labels-)'; then profile=1; fi
            if git diff --name-only "$BEFORE" HEAD | grep -Eq '(onboarding|delivery-smoke|nonblocking-detail)'; then tour=1; fi
          fi
          if [ "$BRANCH_NAME" = 'fix/camera-labels-20261112' ]; then profile=1; fi
          if [ "$BRANCH_NAME" = 'fix/onboarding-ukss-20261113' ]; then tour=1; fi
          echo "camera=$profile" >> "$GITHUB_OUTPUT"
          echo "tour=$tour" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/menu-catalog-contract.mjs
      - run: node tests/ci-contracts.mjs
      - run: node --experimental-vm-modules scripts/ci/fast-check.mjs
      - run: node tests/security-model-inputs.mjs
      - run: node tests/delivery-policy.mjs
      - run: node tests/ci-reliability.mjs
      - run: node tests/map-group-removal-source.mjs
      - run: node tests/camera-labels-source.mjs
      - run: node tests/onboarding-flank-flyover.mjs
      - name: Freeze exact tested candidate inputs
        id: freeze
        run: |
          git diff --exit-code
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > qa-delivery/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-source-check
          path: qa-delivery/
  smoke:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, mobile, workshop]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: museum-smoke-${{ runner.os }}-pw1.57.0-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            museum-playwright-${{ runner.os }}-1.57.0
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Serve the exact candidate without generated edits
        if: github.ref != 'refs/heads/main'
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/delivery-http.log 2>&1 &
      - name: Check retained scene and selected camera profile
        env:
          QA_MODE: ${{ matrix.mode }}
          QA_CAMERA_LABELS: ${{ needs.source.outputs.camera }}
          QA_ONBOARDING_ROUTE: ${{ needs.source.outputs.tour }}
          BAIKONUR_URL: ${{ github.ref == 'refs/heads/main' && 'https://ifdiakov.github.io/baikonur-3d/' || 'http://127.0.0.1:8765/' }}
          VERIFY_PUBLIC: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: node scripts/ci/run-bounded.mjs 900 smoke-${{ matrix.mode }} node tests/delivery-smoke.mjs
      - name: Check model input rejection and retained viewer controls
        if: matrix.mode != 'workshop'
        env:
          QA_MODE: ${{ matrix.mode }}
          BAIKONUR_URL: ${{ github.ref == 'refs/heads/main' && 'https://museum.rockettrip.space/' || 'http://127.0.0.1:8765/' }}
          VERIFY_PUBLIC: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: node scripts/ci/run-bounded.mjs 120 security-${{ matrix.mode }} node tests/security-viewer-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-smoke-${{ matrix.mode }}
          path: |
            qa-delivery/
            qa-ci/smoke-*
          retention-days: 7
