name: Left flank models — targeted acceptance
on:
  push:
    branches: [main, fix/site94-merge-20261112, fix/shelter-road-access-20261112, fix/pantsirs-82-83-20261112, fix/site95-courtyards-20261109]
    paths: ['src/site94*.js','src/site95*.js','src/site92*.js','src/earth-covered-shelters.js','src/shelter-road-access.js','src/archive-buildings.js','src/archive-models.js','src/archive-manifest.js','src/rail-site-clearance.js','scripts/*pantsir*.mjs','scripts/prepare-shelter-access.mjs','scripts/prepare-site94.mjs','scripts/generate-site94-streets.py','tests/site94-*.mjs','tests/shelter-access-*.mjs','tests/pantsirs-*.mjs','tests/site95-*.mjs','.github/workflows/verify-site95.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site95-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      profile: ${{ steps.scope.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the affected left-flank feature
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          profile=shelter
          if [ '${{ github.ref_name }}' = 'fix/site94-merge-20261112' ]; then
            profile=site94
          elif [ -n "$BEFORE" ] && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            if git diff --name-only "$BEFORE" HEAD | grep -Eq '(site94|generate-site94)'; then profile=site94; fi
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: museum-npm-${{ runner.os }}-v1
      - run: npm install --no-save three@0.160.1 meshoptimizer@0.25.0
      - name: Prepare the isolated94/94A candidate
        if: github.ref_name == 'fix/site94-merge-20261112'
        run: |
          python3 -m pip install --quiet shapely==2.1.2
          python3 scripts/generate-site94-streets.py
          node scripts/prepare-site94.mjs
      - name: Prepare the isolated shelter candidate
        if: github.ref_name == 'fix/shelter-road-access-20261112'
        run: node scripts/prepare-shelter-access.mjs
      - name: Require unchanged committed release on main
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code
      - name: Validate changed feature and retained neighbouring models
        run: |
          REQUIRE_BUILT=1 node tests/pantsirs-source.mjs
          node tests/shelter-access-source.mjs
          node tests/site95-source.mjs
          if [ -f src/site94-streets.js ]; then node tests/site94-source.mjs; node tests/map-group-removal-source.mjs; fi
          node --experimental-vm-modules scripts/ci/fast-check.mjs
      - name: Freeze isolated94/94A inputs before browser acceptance
        if: github.ref_name == 'fix/site94-merge-20261112'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html museum.html workshop.html src/site94-streets.js src/archive-models.js src/archive-manifest.js src/map-visible-sites.js tests/map-group-removal-source.mjs
          if ! git diff --cached --quiet; then git commit -m 'Freeze unified94/94A model and source-traced service lanes for acceptance'; git push origin HEAD:${{ github.ref_name }}; fi
      - name: Freeze isolated shelter inputs before browser acceptance
        if: github.ref_name == 'fix/shelter-road-access-20261112'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html museum.html workshop.html src/archive-models.js src/archive-manifest.js src/earth-covered-shelters.js data/catalog.json tests/pantsirs-source.mjs
          if ! git diff --cached --quiet; then git commit -m 'Connect82/83 entrances to existing roads'; git push origin HEAD:${{ github.ref_name }}; fi
      - name: Record tested revision
        id: revision
        run: |
          mkdir -p qa-site94
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > qa-site94/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: left-flank-source
          path: |
            qa-pantsirs/
            qa-site94/
            qa-delivery/
          retention-days: 7
  browser:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, mobile, workshop]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: museum-left-flank-${{ runner.os }}-playwright1.57.0-three0.160.1
      - run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Serve exact candidate
        if: github.ref != 'refs/heads/main'
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/left-flank-browser.log 2>&1 &
      - name: Inspect the changed object on the complete map
        env:
          QA_MODE: ${{ matrix.mode }}
          BAIKONUR_URL: ${{ github.ref == 'refs/heads/main' && 'https://ifdiakov.github.io/baikonur-3d/' || 'http://127.0.0.1:8765/' }}
          VERIFY_PUBLIC: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: |
          if [ '${{ needs.prepare.outputs.profile }}' = 'site94' ]; then
            node scripts/ci/run-bounded.mjs 420 site94-${{ matrix.mode }} node tests/site94-browser.mjs
          else
            node scripts/ci/run-bounded.mjs 420 shelter-access-${{ matrix.mode }} node tests/shelter-access-browser.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: left-flank-${{ matrix.mode }}
          path: |
            qa-pantsirs/
            qa-site94/
            qa-ci/site94-${{ matrix.mode }}.*
            qa-ci/shelter-access-${{ matrix.mode }}.*
          retention-days: 7
