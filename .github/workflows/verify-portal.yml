name: Portal models — site175 silo correction
on:
  push:
    branches: [main, fix/site175-shpu-20261112, fix/ci-repair-20261114]
    paths: ['src/silo-sites.js', 'src/silo-pad.js', 'scripts/apply-site175.mjs', 'tests/site175-*.mjs', '.github/workflows/verify-portal.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-models-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.freeze.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: museum-npm-${{ runner.os }}-v1-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare only site175; main must already contain the exact prepared files
        run: git diff --exit-code
      - name: Verify all32 independent silo exteriors and unchanged approach contract
        run: |
          node tests/site175-source.mjs
          node tests/all-silos-geometry.mjs
          node tests/silo-geometry.mjs
          node --experimental-vm-modules scripts/ci/fast-check.mjs
      - name: Record exact source without publishing
        id: freeze
        run: |
          git diff --exit-code
          mkdir -p qa-site175
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > qa-site175/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site175-source
          path: qa-site175/
          retention-days: 7
  browser:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, mobile, workshop]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: museum-site175-${{ runner.os }}-playwright1.57.0-${{ hashFiles('package-lock.json') }}
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Serve exact candidate
        if: github.ref != 'refs/heads/main'
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/site175-http.log 2>&1 &
      - name: Verify actual site175 model and public bytes on main
        env:
          QA_MODE: ${{ matrix.mode }}
          BAIKONUR_URL: ${{ github.ref == 'refs/heads/main' && 'https://museum.rockettrip.space/' || 'http://127.0.0.1:8765/' }}
          VERIFY_PUBLIC: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: node scripts/ci/run-bounded.mjs 330 site175-${{ matrix.mode }} node tests/site175-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site175-${{ matrix.mode }}
          path: |
            qa-site175/
            qa-ci/site175-*
          retention-days: 7
