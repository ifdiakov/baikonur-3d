name: Portal models — site175 silo correction
on:
  push:
    branches: [main, fix/site175-shpu-20261112]
    paths: ['src/silo-sites.js','src/silo-pad.js','scripts/apply-site175.mjs','tests/site175-*.mjs','.github/workflows/verify-portal.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-models-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.freeze.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: museum-npm-${{ runner.os }}-v1
      - run: npm install --no-save three@0.160.1
      - name: Prepare only site175; main must already contain the exact prepared files
        run: |
          node scripts/apply-site175.mjs
          if [ '${{ github.ref }}' = refs/heads/main ]; then git diff --exit-code; fi
      - name: Verify all32 independent silo exteriors and unchanged approach contract
        run: |
          node tests/site175-source.mjs
          node tests/all-silos-geometry.mjs
          node tests/silo-geometry.mjs
          node --experimental-vm-modules scripts/ci/fast-check.mjs
      - name: Freeze isolated candidate before browser acceptance; never write main
        id: freeze
        run: |
          if [ '${{ github.ref }}' != refs/heads/main ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/silo-sites.js src/facility-ports.js src/archive-manifest.js src/archive-models.js src/model-catalog.js data/catalog.json index.html museum.html workshop.html tests/all-silos-geometry.mjs tests/silo-browser.mjs
            if ! git diff --cached --quiet; then git commit -m 'Use existing silo exhibit for175, preserve road ports and refresh card'; git push origin HEAD:${{ github.ref_name }}; fi
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > qa-site175/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site175-source
          path: qa-site175/
          retention-days: 7
  browser:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, mobile, workshop]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: museum-site175-${{ runner.os }}-playwright1.57.0
      - run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Serve exact candidate
        if: github.ref != 'refs/heads/main'
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/site175-http.log 2>&1 &
      - name: Verify actual site175 model and public bytes on main
        env:
          QA_MODE: ${{ matrix.mode }}
          BAIKONUR_URL: ${{ github.ref == 'refs/heads/main' && 'https://museum.rockettrip.space/' || 'http://127.0.0.1:8765/' }}
          VERIFY_PUBLIC: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: node scripts/ci/run-bounded.mjs 330 site175-${{ matrix.mode }} node tests/site175-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site175-${{ matrix.mode }}
          path: |
            qa-site175/
            qa-ci/site175-*
          retention-days: 7
