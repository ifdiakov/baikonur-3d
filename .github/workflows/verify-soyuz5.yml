name: Soyuz-5 source model
on:
  pull_request:
    branches: [main]
    paths: ["assets/models/rockets/soyuz5*", "src/model-catalog.js", "src/model-facts.js", "src/model-viewer.js", "src/inspection-models.js", "tests/soyuz5-*.mjs", ".github/workflows/verify-soyuz5.yml", "tests/menu-catalog-contract.mjs", "tests/helpers/menu-markup.mjs", "package.json", "package-lock.json", "tests/helpers/qa-scope.mjs"]
  push:
    branches: [main, fix/**]
    paths: ["assets/models/rockets/soyuz5*", "src/model-catalog.js", "src/model-facts.js", "src/model-viewer.js", "src/inspection-models.js", "tests/soyuz5-*.mjs", ".github/workflows/verify-soyuz5.yml", "tests/menu-catalog-contract.mjs", "tests/helpers/menu-markup.mjs", "package.json", "package-lock.json", "tests/helpers/qa-scope.mjs"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soyuz5-${{ github.ref }}
  cancel-in-progress: true
# QA_MOBILE_EXCLUDED_BY_OWNER: not run, never reported as a mobile pass.
env:
  QA_SKIP_MOBILE: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Validate model, textures and menu contracts
        run: |
          node tests/soyuz5-source.mjs
          node tests/menu-catalog-contract.mjs
      - name: Serve checkout
        run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Inspect source model and museum integration
        run: node tests/soyuz5-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soyuz5-evidence
          path: qa-soyuz5/
