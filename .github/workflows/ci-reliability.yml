name: Verify fast and reliable delivery controls
on:
  push:
    branches: [main, fix/delivery-repair-20261111]
    paths: ['scripts/ci/**','tests/ci-reliability.mjs','tests/delivery-policy.mjs','.github/workflows/**','AGENTS.md','docs/CURRENT_WORK.md']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test selection, real failures and deadlines
        run: |
          node tests/ci-reliability.mjs
          node tests/delivery-policy.mjs
          node --experimental-vm-modules scripts/ci/fast-check.mjs
          git diff --exit-code
      - name: Snapshot delivery evidence without changing application files
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/audit-delivery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-diagnosis
          path: |
            qa-delivery/
            qa-ci/
          retention-days: 7
