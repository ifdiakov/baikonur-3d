name: Verify fast and reliable delivery controls
on:
  push:
    branches: [main, fix/ci-reliability-20261109]
    paths: ['scripts/ci/**','scripts/apply-ci-reliability.mjs','tests/ci-reliability.mjs','.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm committed controls need no generated changes
        run: |
          node scripts/apply-ci-reliability.mjs
          node scripts/ci/fix-signature.mjs
          git diff --exit-code
      - name: Test selection, strict comparisons, failure reporting and deadlines
        run: node tests/ci-reliability.mjs
      - name: Verify preparation did not change the application and old test commands remain
        run: |
          git diff --exit-code -- src assets data index.html museum.html workshop.html
          git fetch --no-tags --depth=1 origin 0e51ec655d05d7f52fbbc3bb38868824b552e63d
          python3 - <<'PY'
          import pathlib,re,subprocess
          base='0e51ec655d05d7f52fbbc3bb38868824b552e63d'
          for f in pathlib.Path('.github/workflows').glob('*.yml'):
            text=f.read_text()
            if not text.startswith('# CI_RELIABILITY_V1\n') or f.name=='nonblocking-detail.yml': continue
            old=subprocess.check_output(['git','show',base+':'+str(f)],text=True)
            old_tests=set(re.findall(r'node ((?:tests|scripts)/[^\s;]+\.mjs)',old))
            new_tests=set(re.findall(r'node ((?:tests|scripts)/[^\s;]+\.mjs)',text))
            assert old_tests <= new_tests,(f,old_tests-new_tests)
          print('APPLICATION_PREPARATION_UNCHANGED_AND_EXISTING_TEST_COMMANDS_RETAINED')
          PY
      - name: Record actual change classification
        run: |
          node scripts/ci/impact.mjs release
          git rev-parse HEAD > qa-ci/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reliability-evidence
          path: qa-ci/
          retention-days: 7
  diagnose-public-startup:
    if: contains(github.event.head_commit.message, '[owner19-diagnostic]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: museum-playwright-${{ runner.os }}-1.57.0
      - run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Diagnose unmodified published pages and record all failed resources
        run: node scripts/ci/run-bounded.mjs 210 startup-diagnostic node tests/owner19-startup-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner19-public-startup-diagnostic
          path: qa-ci/
          retention-days: 7
