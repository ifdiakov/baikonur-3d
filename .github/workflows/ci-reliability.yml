name: Verify fast and reliable delivery controls
on:
  push:
    branches: [fix/delivery-audit-20261111]
    paths: ['scripts/ci/audit-delivery.mjs','.github/workflows/ci-reliability.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Collect delivery evidence without building or changing the museum
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/audit-delivery.mjs
      - name: Package exact current text sources for local diagnosis
        if: always()
        run: |
          mkdir -p qa-delivery
          git archive --format=tar.gz HEAD .github scripts tests src data docs AGENTS.md PROJECT_CONTEXT.md index.html museum.html workshop.html > /tmp/delivery-source.tar.gz
          cp /tmp/delivery-source.tar.gz qa-delivery/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-audit
          path: qa-delivery/
          retention-days: 7
