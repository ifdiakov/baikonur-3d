name: Verify fast and reliable delivery controls
on:
  push:
    branches: [main, fix/delivery-repair-20261111]
    paths: ['scripts/ci/**','tests/ci-reliability.mjs','.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture compact delivery diagnosis and exact sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/audit-delivery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-diagnosis
          path: qa-delivery/
          retention-days: 7
