name: Split source snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git ls-files -z | tar --null -T - -czf /tmp/baikonur-split-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: split-source
          path: /tmp/baikonur-split-source.tar.gz
          retention-days: 2
