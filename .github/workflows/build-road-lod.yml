name: Prepare road LOD artifact without rewriting main
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: road-lod-proposal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile exact-source overview lines
        run: |
          node scripts/build-road-lod.mjs
          mkdir -p qa-road-lod
          git rev-parse HEAD > qa-road-lod/source-commit.txt
      - name: Keep the generated proposal with its source revision
        uses: actions/upload-artifact@v4
        with:
          name: road-lod-proposal
          path: |
            data/osm/road-lod-prebuilt-v1.json
            qa-road-lod/source-commit.txt
          retention-days: 7
