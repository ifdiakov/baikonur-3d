name: Generate prebuilt road overview LOD
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-road-lod.mjs'
      - 'data/osm/roads.geojson'
      - 'data/osm/railways.geojson'
      - '.github/workflows/build-road-lod.yml'
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile exact-source overview lines
        run: node scripts/build-road-lod.mjs
      - name: Publish compiled LOD with stable source file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/osm/road-lod-prebuilt-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: regenerate cached map road LOD"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
