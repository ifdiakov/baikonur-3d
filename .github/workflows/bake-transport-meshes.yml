name: Export transport cache for manual inspection
# nonblocking-detail.yml owns the atomic source/cache release.
# This diagnostic exporter must not race the release or overwrite newer caches.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baikonur-transport-baker
  cancel-in-progress: true
jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Export without writing to main
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/cache-export.log 2>&1 &
          node scripts/ci/run-bounded.mjs 300 cache-export node scripts/build-owner19-caches.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-transport-cache
          path: |
            data/osm/transport-geometry-bake-v1.json.gz
            data/osm/road-lod-authoritative-v1.json.gz
            qa-ci/
            qa-owner19/
          retention-days: 3
