name: Restore visitor atmosphere candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visitor-atmosphere-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Integrate presentation without changing terrain or workshop
        run: |
          node scripts/restore-public-atmosphere.mjs
          node scripts/polish-visitor-atmosphere.mjs
          node --check src/public-museum.js
          node --check src/public-atmosphere.js
      - name: Serve candidate
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/atmosphere-http.log 2>&1 &
      - name: Export approved lamp positions and terrain-conforming districts
        run: |
          set -o pipefail
          node scripts/export-public-atmosphere.mjs | tee /tmp/atmosphere-export.log
      - name: Validate terrain, lighting and real visitor rendering
        run: |
          node tests/public-atmosphere-geometry.mjs
          node tests/public-atmosphere-browser.mjs
      - name: Record exact source without publishing
        run: |
          mkdir -p qa-proposal
          git rev-parse HEAD > qa-proposal/source-commit.txt
          git diff --binary > qa-proposal/proposal.patch
      - name: Preserve visual and measurement evidence
        if: always()
        run: |
          mkdir -p qa-public-atmosphere
          cp /tmp/atmosphere-export.log qa-public-atmosphere/ 2>/dev/null || true
          tar -czf qa-public-atmosphere/restored-source.tar.gz src/public-* museum.html data/public-atmosphere.json.gz scripts/restore-public-atmosphere.mjs scripts/export-public-atmosphere.mjs tests/public-atmosphere-*.mjs 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visitor-atmosphere-candidate
          path: qa-public-atmosphere/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-proposal
          path: qa-proposal/
          retention-days: 7
