name: Optimize preloader gallery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: optimize-preloader-gallery
  cancel-in-progress: true
jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Pillow
        run: python3 -m pip install --quiet Pillow
      - name: Optimize gallery WebP files
        run: |
          cp assets/preloader/_source-04.webp assets/preloader/antenna-v1.webp
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ['soyuz-v1.webp','energia-v1.webp','railway-v1.webp','antenna-v1.webp']:
              p=Path('assets/preloader')/name
              im=Image.open(p).convert('RGBA')
              if im.width>1152:
                  h=round(im.height*1152/im.width)
                  im=im.resize((1152,h),Image.Resampling.LANCZOS)
              im.save(p,'WEBP',quality=76,method=4,exact=True)
              print(name, p.stat().st_size, im.size)
          PY
      - name: Record exact source without publishing
        run: |
          mkdir -p qa-proposal
          git rev-parse HEAD > qa-proposal/source-commit.txt
          git diff --binary > qa-proposal/proposal.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-proposal
          path: qa-proposal/
          retention-days: 7
