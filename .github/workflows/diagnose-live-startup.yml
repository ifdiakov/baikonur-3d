name: Diagnose live museum startup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Probe published app startup and capture errors
        run: timeout --signal=TERM --kill-after=8s 85s node tests/live-startup-diagnostic.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: museum-live-startup-diagnostic-${{ github.run_id }}
          path: qa-live-startup/
          retention-days: 5
