name: Museum 5 — reliable startup and release
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'data/**'
      - 'assets/**'
      - 'tests/**'
      - 'scripts/verify-published.mjs'
      - 'scripts/build_river_water.py'
      - 'scripts/prepare-ukss-asset.mjs'
      - 'scripts/ukss-detail-policy.json'
      - 'scripts/prepare-tua-asset.mjs'
      - 'scripts/tua-detail-policy.json'
      - 'scripts/source-models/tua/**'
      - 'docs/tua-source-model.md'
      - 'docs/model-adaptation.md'
      - 'scripts/source-models/ukss/**'
      - 'docs/ukss-source-model.md'
      - 'docs/releases/**'
      - '.github/workflows/verify-osm-release.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create the immutable release after local and public checks pass
        type: boolean
        default: false
concurrency:
  group: baikonur-osm-live-release
  cancel-in-progress: true
permissions:
  contents: read
env:
  RELEASE_TAG: museum5-startup-recovery-20261030-v1
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependencies
        run: |
          npm install --no-save playwright@1.57.0 three@0.160.1
          npx playwright install --with-deps chromium
      - name: Verify geography, source topology and complete Krayniy flight circuit
        run: |
          python3 scripts/build_river_water.py --check
          node tests/osm-geography.mjs
          node tests/transport-pruning.mjs
          node tests/osm-transport-geometry.mjs
          node tests/saturn-natural-terrain.mjs
          node tests/exhibit-road-filter.mjs
          node tests/industrial-road-continuity.mjs
          node tests/road-signs-geometry.mjs
          node tests/river-surface.mjs
          node tests/airport-shore-clearance.mjs
          node tests/osm-release-geometry.mjs
          node tests/river-bank.mjs
          node tests/overview-camera.mjs
          node tests/site41-lighting.mjs
          node tests/silo-geometry.mjs
          node tests/all-silos-geometry.mjs
          node tests/seven-winds-geometry.mjs
          node tests/mzk-sdi-geometry.mjs
          node tests/ukss-source-model.mjs
          node tests/tua-source-model.mjs
      - name: Preserve the detailed Site 31, road, rail and flank invariants
        run: |
          node tests/site31-geometry.mjs
          node tests/road-surfaces-geometry.mjs
          node tests/arrival-geometry.mjs
          node tests/flanks-geometry.mjs
          node tests/train-consist.mjs
      - name: Serve this exact checkout
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/baikonur-preview.log 2>&1 &
          curl --retry 6 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:8765/ --output /dev/null
      - name: Verify the complete local product in Chromium
        run: |
          node tests/startup-browser.mjs
          node tests/osm-release-browser.mjs
          node tests/flanks-browser.mjs
          node tests/mriya-browser.mjs
          node tests/train-browser.mjs
          node tests/silo-browser.mjs
      - name: Verify every published runtime source against this commit
        run: node scripts/verify-published.mjs
      - name: Verify the live museum and capture review images
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/?release=${{ github.sha }}
          QA_PREFIX: public
        run: |
          node tests/startup-browser.mjs
          node tests/osm-release-browser.mjs
          node tests/flanks-browser.mjs
          node tests/mriya-browser.mjs
          node tests/train-browser.mjs
          node tests/silo-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: museum5-startup-recovery-qa
          path: |
            qa-startup/
            qa-osm-release/
            qa-flanks/
            qa-mriya/
            qa-train/
            qa-silo/
            qa-hotel/
          retention-days: 14

  release:
    needs: verify
    if: github.event_name == 'push' || inputs.publish_release == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish a release for the verified, unchanged main commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            const tag = process.env.RELEASE_TAG;
            const sha = context.sha;
            const head = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            if (head.data.object.sha !== sha) {
              throw new Error('main changed after verification; the newer commit must pass the live gate before release');
            }
            let tagObject;
            try {
              tagObject = (await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag})).data.object;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            for (let i = 0; tagObject?.type === 'tag' && i < 5; i++) {
              tagObject = (await github.rest.git.getTag({owner, repo, tag_sha: tagObject.sha})).data.object;
            }
            if (tagObject && (tagObject.type !== 'commit' || tagObject.sha !== sha)) {
              throw new Error('Release tags are immutable. Increment RELEASE_TAG for this new commit.');
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!release) {
              const body = fs.readFileSync('docs/releases/startup-recovery-20261030-v1.md', 'utf8') +
                '\n\nVerified commit: `' + sha + '`\n\n' +
                '[Local and public browser checks](https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId + ')';
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: sha,
                name: 'Интерактивный музей 5 — стабильная загрузка',
                body, draft: false, prerelease: false, make_latest: 'true'
              })).data;
            }
            core.info('Published release: ' + release.html_url);
            await core.summary.addHeading('Verified live museum')
              .addLink('Open the museum', 'https://ifdiakov.github.io/baikonur-3d/')
              .addBreak().addLink('GitHub release', release.html_url)
              .addRaw('\n\nCommit: `' + sha + '`\n').write();
