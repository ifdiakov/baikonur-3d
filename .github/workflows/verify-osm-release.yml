name: Historical full regression — manual only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: historical-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 -m pip install PyYAML==6.0.2
          npm install --no-save playwright@1.57.0 three@0.160.1 @gltf-transform/core@4.5.1 @gltf-transform/extensions@4.5.1 @gltf-transform/functions@4.5.1 meshoptimizer@1.3.0
          python3 scripts/ci/run-archived-regression.py verify_geometry
          python3 scripts/ci/run-archived-regression.py verify_bytes
  browser:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [local, public]
        suite: [progressive-loading, terrain-relief, startup-menu, bridge-exhibits, road-markings, facility-access, facility-lighting, site41, museum, transport, silos, zenit, landing-camera, model-inspector, sdi, energia, site2, labels, road-editor]
    env:
      TARGET: ${{ matrix.target }}
      SUITE: ${{ matrix.suite }}
      BAIKONUR_URL: ${{ matrix.target == 'public' && 'https://ifdiakov.github.io/baikonur-3d/' || '' }}
      QA_PREFIX: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 -m pip install PyYAML==6.0.2
          npm install --no-save playwright@1.57.0 three@0.160.1 @gltf-transform/core@4.5.1 @gltf-transform/extensions@4.5.1 @gltf-transform/functions@4.5.1 meshoptimizer@1.3.0
          npx playwright install --with-deps chromium
          python3 scripts/ci/run-archived-regression.py verify_browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-${{ matrix.target }}-${{ matrix.suite }}
          path: qa-*/
