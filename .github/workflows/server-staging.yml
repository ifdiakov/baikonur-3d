name: Server runner readiness
on:
  push:
    branches: [ops/server-runner-20261114]
    paths: [.github/workflows/server-staging.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baikonur-server-staging
  cancel-in-progress: false
jobs:
  receive-code:
    if: github.repository == 'ifdiakov/baikonur-3d' && github.actor == 'ifdiakov' && (github.ref == 'refs/heads/ops/server-runner-20261114' || github.ref == 'refs/heads/main')
    runs-on: [baikonur-staging]
    timeout-minutes: 10
    steps:
      - name: Check isolated service account
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = actions-runner
          test "$(id -u)" -ne 0
          test ! -r /etc/shadow
          test ! -w /etc/baikonur-runner/allow-job.sh
          test ! -w /etc/systemd/system
          test "$(awk '/NoNewPrivs/ { print $2 }' /proc/self/status)" = 1
          echo 'Non-root runner and service isolation verified'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source received on server
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s museum.html
          test -s workshop.html
          test -d src
          test -d assets
          test -z "$(git status --porcelain)"
          if git config --local --get-regexp 'http\..*extraheader'; then
            echo 'Unexpected persisted GitHub credential'
            exit 1
          fi
          printf 'Received exact commit: %s\n' "$GITHUB_SHA"
          printf 'Museum and workshop source received. No website publication performed.\n'
          sha256sum museum.html workshop.html
