name: Map cards, terrain, transport and lighting editor
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'tests/map-editor-smoke.mjs'
      - 'tests/transport-geometry.mjs'
      - '.github/workflows/verify-map-editor.yml'
  workflow_dispatch:
concurrency:
  group: baikonur-map-editor
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and geometry dependencies
        run: |
          npm install --no-save playwright@1.57.0 three@0.160.1
          npx playwright install --with-deps chromium
      - name: Verify real transport buffers
        run: node tests/transport-geometry.mjs
      - name: Start local museum
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
      - name: Verify local station cards and lighting actions
        run: node tests/map-editor-smoke.mjs
      - name: Await published interface
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsSL --max-time 20 "https://ifdiakov.github.io/baikonur-3d/?check=${GITHUB_SHA}&attempt=${attempt}" | grep -q '20261028-stations-lighting'; then exit 0; fi
            sleep 8
          done
          exit 1
      - name: Verify live museum
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/
        run: node tests/map-editor-smoke.mjs
      - name: Save visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-editor-qa
          path: |
            qa-station-card.png
            qa-lighting-editor.png
            qa-gagarin-track-join.png
            qa-south-two-bridges.png
            qa-saturn-seamless.png
