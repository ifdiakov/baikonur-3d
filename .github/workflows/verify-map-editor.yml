name: Map cards, terrain, transport and lighting editor
# Historical schematic checks are retained for manual inspection.
# The OSM live product is checked and released by verify-osm-release.yml.
on:
  workflow_dispatch:
concurrency:
  group: baikonur-map-editor
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and geometry dependencies
        run: |
          npm install --no-save playwright@1.57.0 three@0.160.1
          npx playwright install --with-deps chromium
      - name: Verify real transport buffers
        run: node tests/transport-geometry.mjs
      - name: Start local museum
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
      - name: Verify local station cards and lighting actions
        run: node tests/map-editor-smoke.mjs
      - name: Await published interface
        run: node scripts/verify-published.mjs
      - name: Verify live museum
        env:
          BAIKONUR_URL: https://ifdiakov.github.io/baikonur-3d/?map-qa=${{ github.sha }}
        run: node tests/map-editor-smoke.mjs
      - name: Save visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-editor-qa
          path: |
            qa-station-card.png
            qa-lighting-editor.png
            qa-gagarin-track-join.png
            qa-south-two-bridges.png
            qa-saturn-seamless.png
