name: Verify Baikonur city territory
on:
  push:
    branches: [main, fix/ci-repair-20261114]
    paths: ['src/city-territory.js', 'src/flank-districts.js', 'tests/flanks-geometry.mjs', '.github/workflows/verify-city-territory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install geometry dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check city polygon source and OSM projection
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {CITY_TERRITORY_OUTLINE,CITY_TERRITORY_COLOR} from './src/city-territory.js';
          assert.equal(CITY_TERRITORY_OUTLINE.length,67);
          assert(CITY_TERRITORY_OUTLINE.every(p=>p.every(Number.isFinite)));
          assert.equal(CITY_TERRITORY_COLOR,0x9e78df);
          console.log('CITY_POLYGON_PASS');
          JS
      - name: Check city mesh and district builder
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import * as THREE from 'three';
          import {buildFlankDistricts} from './src/flank-districts.js';
          const scene=new THREE.Scene(),point=(x,y,h=0)=>new THREE.Vector3((x-650)*3.4,h,(y-522.5)*3.4);
          const districts=buildFlankDistricts(scene,point,1300,1045);
          districts.setOpacity(1);
          const city=scene.getObjectByName('Город Байконур · территория');
          assert(city);assert.equal(city.children.filter(m=>m.userData.museumComponent==='city-territory-boundary').length,3);
          assert.equal(districts.state().city.fillOpacity,.21);
          console.log('CITY_MESH_PASS');
          JS
      - name: Validate city and existing flank relief geometry
        run: node tests/flanks-geometry.mjs
