# CI_RELIABILITY_V1
name: Kosmotrans depot and road fleet
on:
  push:
    branches: [main, codex/kosmotrans-depot-fleet, fix/**]
    paths: ["index.html", "src/kosmotrans-depot.js", "src/road-fleet.js", "src/road-vehicles.js", "src/ground-traffic.js", "assets/models/kosmotrans-depot/**", "assets/models/road-fleet/**", "tests/depot-fleet*.mjs", "tests/road-fleet.mjs", "tests/fixtures/depot-fleet.html", ".github/workflows/verify-depot-fleet.yml", "package.json", "package-lock.json", "tests/helpers/qa-scope.mjs"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: depot-fleet-${{ github.ref }}
  cancel-in-progress: true
# QA_MOBILE_EXCLUDED_BY_OWNER: not run, never reported as a mobile pass.
env:
  QA_SKIP_MOBILE: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select relevant checks before downloading tools
        id: ci_scope
        run: node scripts/ci/impact.mjs verify-depot-fleet.yml
      - uses: actions/setup-node@v4
        if: steps.ci_scope.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Reuse downloaded verification dependencies
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: museum-npm-${{ runner.os }}-v1-${{ hashFiles('package-lock.json') }}
      - name: Reuse matching browser binaries
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: museum-playwright-${{ runner.os }}-1.57.0-${{ hashFiles('package-lock.json') }}
      - name: Install geometry and browser tooling
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check asset budgets and routing
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          node tests/depot-fleet-assets.mjs
          node tests/road-fleet.mjs
          node tests/road-vehicles-geometry.mjs
      - name: Serve the museum
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
      - name: Check source models and the running map
        if: steps.ci_scope.outputs.run == 'true'
        run: node tests/depot-fleet-browser.mjs
      - uses: actions/upload-artifact@v4
        if: (always()) && (steps.ci_scope.outputs.run == 'true')
        with:
          name: depot-fleet-visuals
          path: qa-depot-fleet/
