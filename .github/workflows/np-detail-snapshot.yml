name: NP detail verification snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD -o /tmp/np-detail-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: np-detail-source
          path: /tmp/np-detail-source.tar.gz
          retention-days: 1
