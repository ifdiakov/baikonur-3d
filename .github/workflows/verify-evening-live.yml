name: Verify published evening workshop
on:
  push:
    branches: [main, fix/**]
    paths: [".github/workflows/verify-evening-live.yml", "package.json", "package-lock.json", "tests/evening-navigation-source.mjs", "tests/original-museum-browser.mjs", "tests/evening-navigation-browser-checks.mjs", "tests/helpers/menu-markup.mjs", "src/evening-scene.js", "src/arrival-follow-availability.js", "src/museum-menu.js", "index.html", "museum.html", "workshop.html", "tests/helpers/qa-scope.mjs"]
  workflow_dispatch:
permissions:
  contents: read
# QA_MOBILE_EXCLUDED_BY_OWNER: not run, never reported as a mobile pass.
env:
  QA_SKIP_MOBILE: '1'
jobs:
  public-workshop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify current evening and navigation contracts
        run: node tests/evening-navigation-source.mjs
      - name: Serve exact candidate
        if: github.ref != 'refs/heads/main'
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/evening-http.log 2>&1 &
      - name: Verify workshop, retained evening navigation and editing
        env:
          BAIKONUR_URL: ${{ github.ref == 'refs/heads/main' && 'https://museum.rockettrip.space/' || 'http://127.0.0.1:8765/' }}
          QA_OUT: qa-evening-live/workshop
          QA_MODES: workshop
          VERIFY_PUBLIC: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: node tests/original-museum-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-evening-workshop-verification
          path: qa-evening-live/
          retention-days: 7
