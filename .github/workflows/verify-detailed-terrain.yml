name: Verify detailed steppe materials
on:
  push:
    branches: [main]
    paths:
      - 'src/terrain-material-atlas.js'
      - 'src/terrain-game-detail.js'
      - 'tests/detailed-terrain-materials.mjs'
      - 'tests/detailed-terrain-browser.mjs'
      - '.github/workflows/verify-detailed-terrain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install minimal Three.js and browser test dependencies
        run: |
          npm install --no-save three@0.160.1 playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Validate five-material PBR atlas and terrain shader contracts
        run: node tests/detailed-terrain-materials.mjs
      - name: Verify full museum and detailed terrain shader in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node tests/detailed-terrain-browser.mjs
