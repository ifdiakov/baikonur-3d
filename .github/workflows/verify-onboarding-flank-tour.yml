# CI_RELIABILITY_V1
name: Verify opening flank flyover
on:
  push:
    branches: [main, fix/ci-repair-20261114]
    paths: ['index.html', 'src/museum-onboarding.js', 'tests/onboarding-flank-flyover.mjs', '.github/workflows/verify-onboarding-flank-tour.yml']
  pull_request:
    branches: [main]
    paths: ['index.html', 'src/museum-onboarding.js', 'tests/onboarding-flank-flyover.mjs', '.github/workflows/verify-onboarding-flank-tour.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select relevant checks before downloading tools
        id: ci_scope
        run: node scripts/ci/impact.mjs verify-onboarding-flank-tour.yml
      - uses: actions/setup-node@v4
        if: steps.ci_scope.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Reuse downloaded verification dependencies
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: museum-npm-${{ runner.os }}-v1-${{ hashFiles('package-lock.json') }}
      - name: Reuse matching browser binaries
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: museum-playwright-${{ runner.os }}-1.57.0-${{ hashFiles('package-lock.json') }}
      - name: Verify three-second flank introduction, skip and original-camera return
        if: steps.ci_scope.outputs.run == 'true'
        run: node tests/onboarding-flank-flyover.mjs
