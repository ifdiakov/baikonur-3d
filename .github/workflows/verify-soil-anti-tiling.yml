# CI_RELIABILITY_V1
name: Soil anti-tiling and texture continuity
on:
  push:
    branches: [main, fix/**]
    paths: ["src/soil-anti-tiling.js", "src/global-steppe-detail.js", "src/terrain-game-detail.js", "src/steppe-surface.js", "index.html", "tests/soil-anti-tiling.mjs", ".github/workflows/verify-soil-anti-tiling.yml", "package.json", "package-lock.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soil-anti-tiling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soil:
    name: Non-repeating soil contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select relevant checks before downloading tools
        id: ci_scope
        run: node scripts/ci/impact.mjs verify-soil-anti-tiling.yml
      - uses: actions/setup-node@v4
        if: steps.ci_scope.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Reuse downloaded verification dependencies
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: museum-npm-${{ runner.os }}-v1-${{ hashFiles('package-lock.json') }}
      - name: Reuse matching browser binaries
        if: steps.ci_scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: museum-playwright-${{ runner.os }}-1.57.0-${{ hashFiles('package-lock.json') }}
      - name: JavaScript and shader-source syntax
        if: steps.ci_scope.outputs.run == 'true'
        run: |
          node --check src/soil-anti-tiling.js
          node --check src/global-steppe-detail.js
          node --check src/terrain-game-detail.js
          node --check src/steppe-surface.js
          node --check tests/soil-anti-tiling.mjs
      - name: Atlas mapping, continuous world coordinates and clone regression
        if: steps.ci_scope.outputs.run == 'true'
        run: node tests/soil-anti-tiling.mjs
